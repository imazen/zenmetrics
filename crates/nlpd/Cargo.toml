[package]
name = "nlpd"
version = "0.1.0"
description = "Normalized Laplacian Pyramid Distance for full-reference image quality"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[lints]
workspace = true

[features]
default = []
avx512 = ["archmage/avx512", "magetypes/avx512"]
# Rayon row-striping over the disjoint output rows of the pyramid
# filters/normalizer — writes stay elementwise-disjoint so results are
# bit-identical to the serial path.
parallel = ["dep:rayon"]

[dependencies]
archmage = { workspace = true }
magetypes = { workspace = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
iai-callgrind = "0.16"

[[bench]]
name = "nlpd"
harness = false
