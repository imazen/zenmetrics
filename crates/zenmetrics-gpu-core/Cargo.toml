[package]
name = "zenmetrics-gpu-core"
version = "0.0.1"
description = "Shared backend/score/sRGB/stream plumbing for the zenmetrics *-gpu metric crates (CubeCL)"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[features]
default = []
# Runtime backends. Each implies `cubecl-types` so the stream-plumbing
# helpers (which name concrete cubecl runtimes) compile when any backend
# is enabled — same convention as the *-gpu crates.
cuda = ["cubecl/cuda", "cubecl-types"]
wgpu = ["cubecl/wgpu", "cubecl-types"]
hip  = ["cubecl/hip",  "cubecl-types"]
cpu  = ["cubecl/cpu",  "cubecl-types"]
# Exposes the cubecl-typed stream plumbing (client-on-stream + pool
# cleanup/usage). Off by default.
cubecl-types = []
# zenpixels sRGB conversion helper.
pixels = ["dep:zenpixels", "dep:zenpixels-convert"]

[dependencies]
cubecl = { workspace = true }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["std"], optional = true }
zenpixels-convert = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["std"], optional = true }

# Lint EXCEPTION crate: carries existing unsafe debt, so it cannot
# inherit [workspace.lints] — unsafe_code is `forbid` there and
# member overrides are not possible under workspace=true. Mirror of
# the workspace block minus unsafe_code (root Cargo.toml owns the
# policy; keep in sync — `just quality` will surface drift).
[lints.rust]
# pub items nothing outside the crate can reach -> should be pub(crate);
# the compiler-enforced half of AGENTS.md's API policy.
unreachable_pub = "warn"
# The opt-in `avx512` feature cfg is used by archmage incant! dispatch in the
# metric crates (previously each carried a crate-local [lints.rust] allow).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("avx512"))'] }
# existing unsafe debt (GPU device dispatch / FFI oracle / SIMD);
# unsafe belongs in magetypes/archmage/disjointmut — treat this
# allow as debt to remove, not a license.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# pedantic/nursery stay off: too noisy for ported numeric code.
# Ported-code allows (the zenjpeg-proven list; see zenutils/quality/templates):
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
excessive_precision = "allow"
unreadable_literal = "allow"
approx_constant = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
