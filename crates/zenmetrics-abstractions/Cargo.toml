[package]
name = "zenmetrics-abstractions"
version = "0.0.1"
edition = "2024"
description = "Shared metric abstractions — the object-safe Diffmap trait, the generic PixelSlice-driven Metric surface, and the ScoreKind/MapPolarity semantics enums"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []

[dependencies]
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc"] }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false }
libm = { version = "0.2", default-features = false }
