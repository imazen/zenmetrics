[package]
name = "zenmetrics-math"
version = "0.1.0"
description = "Shared caller-owned SIMD math for image-quality metrics"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
# src/fdlibm*.rs transcribe Sun/FreeBSD msun via libm 0.2.16: `LICENSE-fdlibm`.
license = "AGPL-3.0-or-later"

[features]
default = ["std"]
std = []
avx512 = ["archmage/avx512", "magetypes/avx512"]
parallel = ["std", "dep:rayon"]

[dependencies]
archmage.workspace = true
magetypes.workspace = true
# Scalar reference and edge-lane fallback for the bit-exact `fdlibm` powf.
libm = "0.2.16"
rayon = { version = "1.10", optional = true }

[lints]
workspace = true
