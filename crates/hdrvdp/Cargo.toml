[package]
name = "hdrvdp"
version = "0.0.1"
description = "Pure-Rust CPU port of HDR-VDP-2.2 (Mantiuk et al. 2011), f32 planes + magetypes SIMD"
readme = "README.md"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

# Features follow the iwssim/cvvdp pattern: the SIMD tier is always on
# (archmage dispatches at runtime — scalar fallback keeps i686 / wasm /
# windows-arm portable), `avx512` opts the v4/v4x tiers into `incant!`
# dispatch, and `parallel` is an opt-in rayon feature. The fleet-speed
# rewrite superseded the old "zero-dep bit-exact reference" policy — the
# official-golden tolerance test is now the correctness gate.

[features]
default = []
_dev = ["archmage/testable_dispatch"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
parallel = ["dep:rayon"]

[dependencies]
archmage = { workspace = true }
magetypes = { workspace = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
# Decoding the real corpus images for the end-to-end ladder example. Dev-only:
# the library itself stays dependency-free.
image = { workspace = true, features = ["png", "jpeg", "exr"] }
zenmetrics-corpus = { path = "../zenmetrics-corpus" }
# Interleaved benchmarking with paired statistics (workspace standard).
zenbench = "0.1.7"

[[example]]
name = "score_corpus_ladder"

[[bench]]
name = "pipeline"
harness = false
