[package]
name = "mdctpsnr"
version = "0.1.0"
description = "Pure-Rust CPU port of mDCT-PSNR (Thomas Richter / University of Stuttgart masked-DCT perceptual metric)"
readme = "README.md"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
# Rust reimplementation of mDCTpsnr (zlib): verbatim notice in `LICENSE-mDCTpsnr`.
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[features]
default = ["std"]
# Use the standard library. Off -> core + alloc only.
std = ["zenmetrics-abstractions/std"]
# Rayon row-band parallelism over the independent masking pipelines and
# column-striped errorline measurement. Implies std (rayon requires it).
parallel = ["std", "dep:rayon"]

[dependencies]
zenmetrics-abstractions = { path = "../zenmetrics-abstractions", default-features = false }
archmage = { workspace = true }
libm = "0.2.16"
magetypes = { workspace = true }
rayon = { version = "1.10", optional = true }

# Fully safe since the unsafe purge (2026-10): the former libmvec
# asm/transmute shims and `*_fma` target_feature clones are now
# `#[attune]` proof wrappers over magetypes mid-precision kernels.
[lints]
workspace = true
