# CKDN: conditional knowledge distillation network (degraded-reference IQA),
# used as a plain FR metric via the degenerate feed cat(dist, ref, dist, ref),
# score = output[:,0] (`dr`) as in upstream predict_score.py.
name = "ckdn"
kind = "full-reference"
direction = "higher-is-closer"        # sigmoid quality score in (0, 1)
columns = ["ckdn"]
paper = "Zheng, Fu, Zeng, Zha, Luo. Learning Conditional Knowledge Distillation for Degraded-Reference Image Quality Assessment. ICCV 2021"

[code]
source = "upstream-port"             # trunk split reimplemented; tail runs upstream fc_/csp verbatim
upstream = "https://github.com/researchmm/CKDN"
upstream_package = "git clone of researchmm/CKDN (no pip package; commit tip 2026-10-15)"
licence = "MIT"

[weights]
# The MIT LICENSE covers the repository code; the trained checkpoint is
# distributed through a Google Drive link in the README with no licence stated
# for the weights themselves, so loading needs an explicit WeightsConsent.
licence_class = "unknown"
checkpoint = "https://drive.google.com/file/d/13HzxPsRWdPC_CAsbvgMgU5IG_TKPVbNe/view"

[input]
format = "packed sRGB8"
normalisation = "u8 as f32 (0..255), then (x - mean*255) / (std*255) inside the graph — upstream's PrefetchLoader does exactly this on the 12-channel input (ImageNet mean/std repeated per 3-channel group)"
resize = "eval transform always applied: short side -> 329 (long side floored, torchvision Resize(int) semantics) then CentreCrop(288); antialiased bicubic for the distorted image, NEAREST for the reference. This is what upstream predict_score.py's timm loader does (img_size=288, crop_pct=0.875) — and what the AIC-4 published column was scored with (pyiqa's wrapper; nearest-on-ref verified by bit-exact capture of its network inputs)."
min_size = 1                         # measured: fully convolutional + adaptive pool; the graphs always see 288x288 after the transform

[export]
script = "export.py"
outputs = "ckdn_{qse.onnx, dte.onnx, tail.onnx, full.onnx, meta, goldens.tsv, export.meta}"
opset = 17
notes = "qse/dte are the two encoder branches (ResNet conv1+layer1 each); tail is csp (layer2) + avgpool + fc_ + sigmoid on the 256-channel difference. Under cat(d,r,d,r) upstream's fr == dr and nr is input-independent, so dr alone is the metric."

[parity]
oracle = "researchmm/CKDN checkpoint epoch 14, CPU, fp32"
tolerance_jnd = 1e-3                 # TOL_JND: fraction of the KonJND-measured JND (jnd_scale.tsv)
jnd = 0.005276                       # median |score - score(same-ref identical pair)|, 1008 KonJND pairs, this port (ort-cuda), with the eval transform
results = "rten worst |d| 2.981e-7 (5.7e-5 JND); ort-cuda worst |d| 2.683e-7 (5.1e-5 JND); 15 goldens under the eval transform"

[aic4]
column = "CKDN"
results = "matches: median |d| 4.0e-05, max |d| 1.4e-04 on all 61 crop pairs (this port, ort-cuda). Native feed without the transform was median 3.5e-02 / max 3.7e-01 — the transform IS the published convention"
finding = "The published column is the upstream epoch-14 checkpoint (pyiqa's CKDN_model_best-38b27dc6.pth is a repack — 290/290 tensors bit-identical) under pyiqa's loader convention: dist -> antialiased-bicubic resize short->329 + cc288, ref -> NEAREST resize short->329 + cc288, cat(d',r',d',r') -> dr. Identified by black-box probing only (impulse/crop/affine input captures); no pyiqa source read or used. torch's antialiased bicubic is Catmull-Rom a=-0.5 (verified vs F.interpolate impulse weights), torch NEAREST is floor(i*in/out); both re-implemented in src/resize.rs."
