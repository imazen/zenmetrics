# LPIPS v0.1, VGG16 trunk.
name = "lpips-vgg"
kind = "full-reference"
direction = "lower-is-closer"
paper = "Zhang, Isola, Efros, Shechtman, Wang. The Unreasonable Effectiveness of Deep Features as a Perceptual Metric. CVPR 2018. arXiv:1801.03924"

[code]
source = "upstream-port"             # head reimplemented from the upstream package's forward()
upstream = "https://github.com/richzhang/PerceptualSimilarity"
upstream_package = "lpips==0.1.4"
licence = "BSD-2-Clause"

[weights]
licence_class = "permissive"
# The lin layers ship with the lpips package (BSD-2-Clause). The VGG16 trunk is
# torchvision's ImageNet checkpoint (vgg16-397923af.pth, torchvision BSD-3-Clause
# code); ImageNet terms may apply to the weights (counsel item, PYIQA_PORT_PLAN.md §9).
lin = "lpips 0.1.4: lpips/weights/v0.1/vgg.pth"
trunk = "https://download.pytorch.org/models/vgg16-397923af.pth"

[input]
format = "packed sRGB8"
normalisation = "(v / 255) * 2 - 1, then LPIPS ScalingLayer (inside the graph)"
resize = "none"
min_size = 16

[export]
script = "export.py"
graph = "lpips_vgg_trunk.onnx: x[1,3,H,W] -> 5 taps (relu1_2, relu2_2, relu3_3, relu4_3, relu5_3)"
opset = 17

[parity]
oracle = "lpips 0.1.4, CPU, fp32"
tolerance_abs = 1e-4                 # proposed, pending sign-off
