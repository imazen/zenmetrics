name = "pieapp"
kind = "full-reference"
direction = "lower-is-better"
columns = ["pieapp"]
score_revision = 3
paper = "Prashnani, Cai, Mostofi, Sen. PieAPP: Perceptual Image-Error Assessment through Pairwise Preference. CVPR 2018. https://arxiv.org/abs/1806.02067"

[code]
source = "paper-and-weight-metadata-reconstruction"
implementation = "Independently written from section 3 / figure 4 and checkpoint tensor names/shapes. Official source files are not read or imported by the reconstruction. The official public entry point and documented CLI are opaque oracles only."
provenance = "PROVENANCE.md"

[weights]
licence_class = "noncommercial"
terms = "Modified BSD-2 for Non-Commercial Use Only, UC Regents"
terms_url = "https://github.com/prashnani/PerceptualImageError/blob/master/LICENSE.txt"
checkpoint = "https://web.ece.ucsb.edu/~ekta/projects/PieAPPv0.1/weights/PieAPPv0.1.pth"
sha256 = "0937b01480c7a637ae3018af755faa8ecde4788b52bb246b7ae62cf96fb6baf0"
consent = "PieApp::WEIGHTS; ZENMETRICS_NN_ACCEPT_WEIGHTS=pieapp"
bundled = false

[input]
format = "strided RGB8 sRGB"
graph_input = "NCHW RGB [0,1]"
network_input = "NCHW BGR code values [0,255]"
patch_size = 64
stride = 6
sampling_source = "Official release README documents deterministic dense stride 6 as the default; paper section 3 instead describes random sampling of 1024 patches."
min_size = 64
max_side = 4096
max_pixels = 9000000
max_pixels_32bit = 1048576

[execution]
engines = ["rten", "ort-cuda"]
batch_bound = 32
batch_unit = "reference/distorted patch pairs"
statistics = "Host f64 weighted pooling of graph patch errors/weights; fixed row-major order."
weight_head = "Signed raw weight + 1e-6; identified by opaque bias/projection controls"
