cap_graph_sha256 = "7033ea6ec2b0de54c9eb8a2b34002a8f8e026cecf982a4cd51b74a13c2be0322"
warm_reference = "Caches planar input conversion only; reuses_reference_work() is false because neural features are recomputed."
maps = false

