# A-FINE: adaptive fidelity-naturalness evaluation, FR IQA for AI-generated
# (SRIQA) images. The `afine` column is upstream's raw adapter output
# `afine_all` — what the AIC-4 `A-FINE` column publishes — not the 0..100
# `afine_all_scale` wrapper.
name = "afine"
kind = "full-reference"
direction = "lower-is-better"        # distortion/naturalness score, ~-2..2
columns = ["afine"]
paper = "Du et al. A-FINE: Adaptive Fidelity-Naturalness Evaluation for AI-Generated Image Quality Assessment. IEEE TMM 2024"

[code]
source = "upstream-port"             # CLIP visual trunk + heads from upstream's own modules
upstream = "https://github.com/ChrisDud0257/AFINE"
upstream_package = "git clone of ChrisDud0257/AFINE (no pip package; QuickInference/)"
licence = "Apache-2.0"

[weights]
# Apache-2.0 covers the repository code; afine.pth is distributed through a
# Google Drive link in the README with no licence stated for the weights
# (the pyiqa repack on huggingface.co/chaofengc/IQA-PyTorch-Weights is
# byte-identical at 610,806,721 bytes). Loading needs an explicit
# WeightsConsent. The fine-tuned CLIP overlays OpenAI's ViT-B-32.pt
# (openaipublic.azureedge.net URL in upstream's afine.py).
licence_class = "unknown"
checkpoint = "https://drive.google.com/drive/folders/1SgcMmv-9yejHYTT8F8hGN_5Vv8hfGMmR (afine.pth); plus OpenAI ViT-B-32.pt"

[input]
format = "packed sRGB8"
normalisation = "0..1 then CLIP stats (0.48145466, 0.4578275, 0.40821073 / 0.26862954, 0.26130258, 0.27577711); the heads de-normalize internally (x*std+mean)"
resize = "upstream afine.py: F.interpolate(mode='bicubic', align_corners=False) UPSAMPLE to the next multiple of 32 on each axis that needs it (a=-0.75, 4 taps, edge-clamp, no renorm — resize.rs::resize_bicubic, impulse-verified vs torch)"
min_size = 1                         # anything smaller is upsampled to 32; N = (H'/32)(W'/32) tokens

[export]
script = "export.py"
outputs = "afine_{trunk.onnx, full.onnx, heads.f32, meta, goldens.tsv, export.meta}"
opset = 17
notes = "afine_trunk.onnx: normalized [1,3,H,W] -> 12 token maps [1,768,N,1] (encode_image's per-layer features, cls excluded — unused by the heads). afine_full.onnx: (r,d) -> afine_all scalar; the NLM scalers' exp_pow>=10 python-if is emitted branch-free via torch.where so the traced graph is exact on every input. Steps 4-6 (qhead/dhead statistics + NLM + adapter) run in Rust from afine_heads.f32."

[parity]
oracle = "upstream afine.pth + ViT-B-32.pt, CPU, fp32, upstream preprocessing"
tolerance_jnd = 1e-3                 # TOL_JND: fraction of the KonJND-measured JND (jnd_scale.tsv)
jnd = 0.0                            # TODO measured JND — filled by the KonJND run
results = "pending"

[aic4]
column = "A-FINE"
results = "pending"
finding = "The published column's range (-1.95..-0.66 on the crops) identifies it as the raw afine_all adapter output, not afine_all_scale (0..100)."
