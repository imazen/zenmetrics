# Model card: DMM (IEEE TIP 2025).
name = "dmm"
kind = "full-reference distance (lower is better)"

[code]
source = "upstream-port"
upstream = "https://github.com/Baoliang93/DMM"
upstream_package = "pip `DMM_PyTorch` (DMM_PyTorch/DMM.py)"
licence = "MIT (Baoliang Chen 2024)"
notes = "Debiased Mapping for FR-IQA: VGG16 with every MaxPool2d replaced by L2 pooling (3x3 Hann-window RMS), taps at relu3_3/relu4_3, then an unfold-16/stride-4 per-patch SVD head. The head cannot be expressed in ONNX (torch.svd), so the port keeps it in Rust: svd16 is a faithful f32 transliteration of LAPACK's dgebd2->dorg2r->dbdsqr->dlasdq->dbdsdc (gesdd path for n=16). The score's wt term is draw-sensitive (which orthonormal basis a solver emits inside degenerate singular clusters): a cyclic-Jacobi eigensolver deviated ~+11% vs torch.svd; the LAPACK port tracks MKL's sgesdd draw to ~0.03% on identical taps."

[weights]
# VGG16 'IMAGENET1K_V1' via torchvision — permissive (BSD-3 torchvision /
# ImageNet backbone weights as distributed by torchvision). There is NO
# trained DMM checkpoint: the metric is parameter-free past the backbone,
# so no WeightsConsent gate.
licence_class = "permissive"
checkpoint = "torchvision vgg16 IMAGENET1K_V1 (fetched by torchvision)"
trained_on = "n/a — no fitted parameters"

[input]
format = "packed sRGB8"
normalisation = "v/255 -> [0,1]; upstream's input_norm defaults to off"
resize = "prepare_image_adt: if min(h,w) > 128, PIL-bilinear resize short side to max(floor(min/48)*32, 128), long side int(new*long/short); <=128 images pass through. The port reproduces Pillow's fixed-point BILINEAR bit-exactly (resize_bilinear_pil_u8 — zenresize has no Pillow-exactness knob: i16@2^14 largest-remainder vs Pillow's 2^22 last-tap fold)"
min_size = 128                        # taps smaller than one 16x16 patch cannot be scored

[export]
script = "export.py"
outputs = "dmm_{trunk.onnx, meta, goldens.tsv, export.meta}"
opset = 17
notes = "dmm_trunk.onnx: [1,3,h,w] -> t3 [1,256,h/4,w/4] (relu3_3), t4 [1,512,h/8,w/8] (relu4_3), both under L2 pooling. Self-checks at export: trunk taps == upstream FeaturesExtractor <1e-6; the chunked head replica == upstream DMM() <1e-5. Goldens are upstream DMM() scores under prepare_image_adt (CPU, fp32)."

[parity]
oracle = "Baoliang93/DMM upstream DMM(), CPU fp32, prepare_image_adt"
tolerance_jnd = 1e-3                 # TOL_JND: fraction of the KonJND-measured JND (jnd_scale.tsv)
jnd = "0.191420 (KonJND-1k 1008 pairs, ort-cuda, 2026-10-16; JPEG 0.167535 / BPG 0.218804 — benchmarks/nn_konjnd_scale_2026-10-15.md)"
results = "FAILS the strict gate — structural, measured, not relaxed. rten: median |d| 1.77e-3, max 5.7e-2 (1/24 rows ≤ 1.9142e-4). ort-cuda: median 8.1e-4, max 0.176 (2/24). The wt term consumes the SVD draw, so the score is implementation-defined in degenerate clusters: on 2207_128 MKL-on-our-taps 31.498 ≈ golden 31.513 while our netlib-sgesdd-faithful head draws 31.689 — and scipy sgesdd gives the identical draw (wt 3.8179 vs ours 3.8181 on the worst patch). MKL's proprietary draw is unreachable from pure Rust; even torch CPU-vs-CUDA differ ~9e-3 median on this metric. Trunk noise (ort-vs-torch taps ~2e-5) adds ~±5e-4 more. benchmarks/dmm_aic_probe/."

[aic4]
convention = "AIC-4 2026 publishes a DMM column (metrics_subset.csv). It was computed via pyiqa's dmm_arch.py: SQUARE anamorphic F.interpolate bilinear (840x944->544x544) on CUDA torch.svd — not upstream's aspect-preserving PIL resize."
results = "Published column reproduced bit-exact (61/61, |d| = 0.000e+00) under the pyiqa convention + cusolver draws — benchmarks/dmm_aic_probe/aic_dmm_pyiqa_cuda.tsv. Our native port (upstream convention) differs: median |d| 7.47e-2, max 0.417 — the square-vs-aspect input difference, not port error."
