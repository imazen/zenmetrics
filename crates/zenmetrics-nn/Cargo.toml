[package]
name = "zenmetrics-nn"
version = "0.1.0"
description = "Learned image-quality metrics (LPIPS first) on exported ONNX graphs, with pure-Rust engines"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[lints]
workspace = true

[features]
default = ["rten"]
# Pure-Rust CPU engine (also builds for wasm).
rten = ["dep:rten", "dep:rten-tensor"]
# ONNX Runtime (C++), loaded at run time from ORT_DYLIB_PATH. CUDA execution
# provider with TF32 off. Fleet throughput engine; off by default.
ort = ["dep:ort"]
# Parity tests against upstream goldens. They need exported models in
# ZENMETRICS_NN_MODEL_DIR; run them through `just nn-parity`.
model-tests = []

[dependencies]
zenmetrics-abstractions = { path = "../zenmetrics-abstractions", default-features = false }
# Pinned to unmerged PR #18 (`resample-conventions`): provides the framework
# resampling conventions (`PillowCubicResizer`, `InterpolationDetails::cubic_bc`,
# `gaussian_tf`, `SampleMapping`/`BoundaryMode`). MUST move to the released
# zenresize version that lands PR #18 before this crate is published/landed.
zenresize = { git = "https://github.com/imazen/zenresize", rev = "4f5287e65f28b24815ffe49effa2dc40284da471" }
rten = { version = "0.27.0", optional = true, default-features = false, features = ["onnx_format"] }
rten-tensor = { version = "0.27.0", optional = true }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "load-dynamic", "cuda", "api-31"] }

[dev-dependencies]
zenpng = { path = "../../../zenpng" }
enough = "0.4.4"

[[test]]
name = "parity"
required-features = ["model-tests"]

[[test]]
name = "wd_parity"
required-features = ["model-tests"]
