[package]
name = "vmaf"
version = "0.1.0"
description = "Pure-Rust VMAF v0.6.1 and v1.0.16 YUV420 scorers matching Netflix libvmaf v3.2.1"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[dependencies]
archmage = { workspace = true, optional = true }
magetypes = { workspace = true, optional = true }
rayon = { version = "=1.12.0", optional = true }
serde_json = { workspace = true }

[dev-dependencies]
vmaf-head-sys = "=0.2.0"

[[bench]]
name = "backends"
harness = false

# archmage::incant! checks `cfg(feature = "avx512")` internally even when no
# AVX-512 tier is listed (same allow as crates/iwssim, crates/gmsd).
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("avx512"))'] }

[features]
parallel = ["dep:rayon"]
simd = ["dep:archmage", "dep:magetypes"]
# Opt-in AVX-512 `v4` tier for the intrinsic-ported kernels (same shape as
# crates/vif, crates/gmsd, crates/psnrhvs).
avx512 = ["simd", "archmage/avx512", "magetypes/avx512"]
