[package]
name = "vmaf"
version = "0.1.0"
description = "Pure-Rust VMAF v0.6.1 and v1.0.16 YUV420 scorers matching Netflix libvmaf v3.2.1"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[dependencies]
archmage = { workspace = true, optional = true }
magetypes = { workspace = true, optional = true }
rayon = { version = "=1.12.0", optional = true }
serde_json = { workspace = true }

[dev-dependencies]
vmaf-head-sys = "=0.2.0"

[[bench]]
name = "backends"
harness = false

[[bench]]
name = "arm_stages"
harness = false

[features]
parallel = ["dep:rayon"]
simd = ["dep:archmage", "dep:magetypes"]
