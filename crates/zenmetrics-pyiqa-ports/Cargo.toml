[package]
name = "zenmetrics-pyiqa-ports"
version = "0.1.0"
description = "Ports of IQA metrics whose only reference code is pyiqa (non-commercial terms)"
edition.workspace = true
rust-version.workspace = true
# Derived from pyiqa (IQA-PyTorch), which is under PolyForm Noncommercial 1.0.0
# plus the S-Lab License 1.0. This crate carries those terms; nothing else in the
# workspace does. See README.md.
license-file = "LICENSE-pyiqa"
publish = false

[lints]
workspace = true

[features]
default = ["rten"]
# Pure-Rust CPU engine.
rten = ["dep:rten", "dep:rten-tensor", "zenmetrics-nn/rten"]
# ONNX Runtime (CPU and CUDA providers), loaded at run time from ORT_DYLIB_PATH.
ort = ["dep:ort", "zenmetrics-nn/ort"]

[dependencies]
zenmetrics-nn = { path = "../zenmetrics-nn", default-features = false }
zenmetrics-abstractions = { path = "../zenmetrics-abstractions", default-features = false }
# Same versions and features as zenmetrics-nn's engines.
rten = { version = "0.27.0", optional = true, default-features = false, features = ["onnx_format"] }
rten-tensor = { version = "0.27.0", optional = true }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "load-dynamic", "cuda", "api-31"] }
