[package]
name = "fsim"
version = "0.1.0"
description = "Pure-Rust CPU port of FSIM / FSIMc (Zhang et al., IEEE TIP 20:9, 2011), phase-congruency feature similarity with a vendored self-contained FFT"
readme = "README.md"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

# archmage::incant! checks `cfg(feature = "avx512")` internally even when no
# AVX-512 tier is listed (same allow as crates/iwssim, crates/gmsd).
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("avx512"))'] }

[features]
default = ["std"]
# Use the standard library. Off -> core + alloc only.
std = []
# Rayon parallelism across the four phase-congruency orientations. Results
# are bit-identical at every thread count: each orientation writes its own
# accumulator planes, which are combined in fixed orientation order, and the
# scalar reductions keep a fixed raster order.
parallel = ["std", "dep:rayon"]
# Dev-only: exposes the per-tier score entry points so the SIMD tiers can be
# compared against the scalar tier in tests and disassembled. Not API.
_dev = ["archmage/testable_dispatch"]
# Opt-in AVX-512 `v4` tier (16-wide f32), like crates/gmsd and crates/psnrhvs.
avx512 = ["archmage/avx512", "magetypes/avx512"]

[dependencies]
archmage = { workspace = true }
libm = "0.2.16"
magetypes = { workspace = true }
rayon = { version = "1.10", optional = true }
