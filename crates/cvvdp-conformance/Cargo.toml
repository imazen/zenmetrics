[package]
name = "cvvdp-conformance"
version = "0.0.1"
description = "Conformance harness validating cvvdp + cvvdp-gpu against the pycvvdp reference (v0.5.7 goldens) across a display × situation matrix"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[features]
# By default the crate only builds the situation generator + matrix
# definitions (pure CPU, no goldens, no GPU). `cargo test -p
# cvvdp-conformance` then runs the offline self-tests (deterministic
# situation hashes, matrix-cardinality pins) without touching the
# network or a GPU.
default = []
# Enables the full conformance matrix test: fetches the pycvvdp
# pycvvdp goldens (conformance-v2 = v0.5.7) from R2 and scores BOTH cvvdp and cvvdp-gpu
# against them, writing the result TSV. Mirrors cvvdp-gpu's
# `parity-goldens` feature so offline `cargo test` stays green and
# the matrix runs explicitly. NOT the silent-runtime-skip
# anti-pattern: when this feature is off the matrix test isn't
# compiled in at all.
conformance-goldens = ["cuda", "dep:ureq", "dep:sha2"]
# GPU backend selectors (forwarded to cvvdp-gpu). The conformance
# matrix needs a real GPU runtime to exercise the cvvdp_gpu impl.
cuda = ["cvvdp-gpu/cuda", "cvvdp-gpu/cubecl-types", "dep:cubecl"]
wgpu = ["cvvdp-gpu/wgpu", "cvvdp-gpu/cubecl-types", "dep:cubecl"]

[dependencies]
cvvdp = { workspace = true }
cvvdp-gpu = { workspace = true, default-features = false, features = ["pixels"] }
serde_json = { workspace = true }
# `image` remains ONLY for `jpeg_roundtrip` in situations.rs: the
# still goldens were built with its JPEG codec's output baked in, so
# swapping to zenjpeg would silently invalidate the R2 still-parity
# baseline. All PNG work (8-bit + 16-bit) uses zenpng below.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# zenpng at github main per repo policy ("github main versions of zen
# crates"). This bypasses the root [patch.crates-io] zenpng→../zenpng
# path pin (patches only rewrite crates-io deps) intentionally: the
# patch keeps `n` on the local checkout while this crate tracks main.
zenpng = { git = "https://github.com/imazen/zenpng", branch = "main" }
# `enough` must come from crates.io, NOT git main: zenpng's own
# manifest requests crates-io `enough`, and a second-source copy
# would make `enough::Stop` a different trait — `&Unstoppable` would
# no longer satisfy `&dyn Stop`. The version req mirrors zenpng's.
enough = "0.4.2"
imgref = { workspace = true }
rgb = { workspace = true }
cubecl = { workspace = true, optional = true }
# Only built when `conformance-goldens` is on. Cargo can't make
# dev-deps optional, so the golden-fetch deps live here as opt-in
# normal deps gated by the feature.
ureq = { version = "3.3.0", optional = true }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
sha2 = "0.11.0"

[[bin]]
name = "emit_situations"
# Pure CPU — emits the situation corpus PNGs + manifest for the
# pycvvdp golden builder. No GPU / goldens feature needed.

[[bin]]
name = "emit_video_situations"
# Pure CPU — emits the video situation corpus PNG frames + manifest
# for the pycvvdp video golden builder. No GPU / goldens feature
# needed.

# The full conformance matrix test only compiles when the
# `conformance-goldens` feature is on (it needs a GPU runtime + the
# R2 golden fetch). Off by default so `cargo test -p cvvdp-conformance`
# stays offline + GPU-free (runs only the lib self-tests).
[[test]]
name = "conformance"
required-features = ["conformance-goldens"]
