[package]
name = "zensim-gpu"
version = "0.0.1"
description = "Multi-vendor GPU implementation of the zensim perceptual similarity feature extractor, via CubeCL"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
rust-version.workspace = true
publish = false

[features]
default = ["cuda", "wgpu", "cpu", "fast-reduction", "pixels"]
# Runtime features imply `cubecl-types` so examples / tests that
# import `Zensim<R>` directly compile when any backend feature is
# enabled.
cuda = ["cubecl/cuda", "cubecl-types", "zenmetrics-gpu-core/cuda"]
wgpu = ["cubecl/wgpu", "cubecl-types", "zenmetrics-gpu-core/wgpu"]
hip  = ["cubecl/hip",  "cubecl-types", "zenmetrics-gpu-core/hip"]
cpu  = ["cubecl/cpu",  "cubecl-types", "zenmetrics-gpu-core/cpu"]
# Opaque-API zenpixels integration — see dssim-gpu/Cargo.toml.
pixels = ["dep:zenpixels", "zenmetrics-gpu-core/pixels"]
# Exposes the generic typed Zensim<R>. Off by default.
cubecl-types = ["zenmetrics-gpu-core/cubecl-types"]
# Use Atomic<u32>::fetch_max + per-block partials for the per-column
# accumulators. Same backend reality as dssim-gpu / ssim2-gpu: works on
# CUDA / DX12 / HIP; Metal silently no-ops Atomic<f32>::fetch_add. The
# `fast-reduction` flag here only gates the f32 atomic-add fast path
# for the per-feature scalar fold; the f64 sum precision is preserved
# by host-side promotion on read-back.
fast-reduction = []

[dependencies]
cubecl = { workspace = true }
zenmetrics-gpu-core = { path = "../zenmetrics-gpu-core", default-features = false }
# `zensim` is needed in non-dev so the opaque `ZensimOpaque::compute_*`
# scoring path can call the canonical CPU `score_features_with_profile`
# entry — that's how this crate produces bit-exact CPU-equivalent
# scores on top of GPU-extracted features (per-sample-α head, tanh
# output pin, PCHIP spline, per-codec affine — all live in the CPU
# `zensim` crate's bake-eval path).
zensim = { workspace = true }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["std"], optional = true }
# Cooperative cancellation for the strip walkers (`*_with_stop`, zenmetrics#30).
enough = "0.4.4"

[dev-dependencies]
# Constructible `Stop` flag for the cancellation tests.
almost-enough = "0.4.4"
# `custom-profiles` lets the parity-lock test reconstruct the removed
# linear `PreviewV0_2` built-in as a `Custom` profile (bit-identical
# params) — needed so the CPU reference score matches the GPU path's
# 228-feature linear `score_from_features`.
zensim = { workspace = true, features = ["custom-profiles", "feature-regime-v2"] }
bytemuck = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
zenmetrics-corpus = { workspace = true }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["std"] }
zenbench = { version = "0.1.8", features = ["criterion-compat"] }

[[example]]
name = "bench"
required-features = ["cubecl-types"]

[[example]]
name = "debug_features"
required-features = ["cubecl-types"]

[[example]]
