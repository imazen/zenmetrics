[package]
name = "zenfleet-core"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Content-addressed job taxonomy, identity, status, and blob addressing — Phase-0 keystone for the zen job system."
license = "MIT OR Apache-2.0"

[dependencies]
sha2 = "0.10.9"
hex = "0.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Weighted rendezvous hashing needs ln(); the SYSTEM libm rounds differently across
# vendors/platforms (x86 glibc vs aarch64 — the fleet runs both), which would let two
# workers disagree on a near-tie owner. The pure-Rust libm crate is bit-identical
# everywhere (IEEE basic ops only), so shard ownership stays cross-platform deterministic.
libm = "0.2.16"
