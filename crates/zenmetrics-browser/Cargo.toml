[package]
name = "zenmetrics-browser"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Worker-based browser IQA and spatial error-map viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenmetrics-api = { workspace = true, default-features = false, features = ["cpu-ssim2", "cpu-dssim", "cpu-butter", "cpu-zensim", "cpu-cvvdp", "cpu-iwssim"] }
butteraugli = { workspace = true }
dssim-core = { workspace = true }
rgb = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
bytemuck = { workspace = true }
cvvdp = { workspace = true, features = ["std", "parallel"] }
iwssim = { workspace = true, features = ["std", "parallel"] }
gmsd = { workspace = true, features = ["std", "parallel"], optional = true }
psnrhvs = { workspace = true, features = ["std", "parallel"], optional = true }
haarpsi = { workspace = true, features = ["std", "parallel"], optional = true }
zenmetrics-abstractions = { path = "../zenmetrics-abstractions", default-features = false }
# SSIMULACRA2's native spatial terms (`compute_ssimulacra2_maps`) for the
# unified-surface adapter in `src/ssim2_map.rs`; the scalar route stays on
# zenmetrics-api's `cpu-ssim2`.
fast-ssim2 = { path = "../../../fast-ssim2/fast-ssim2", default-features = false }
fsim = { workspace = true, features = ["std", "parallel"], optional = true }
vsi = { workspace = true, features = ["std", "parallel"], optional = true }
msssim = { workspace = true, features = ["std", "parallel"], optional = true }
vif = { workspace = true, features = ["std", "parallel"], optional = true }
mad-iqa = { workspace = true, features = ["std", "parallel"], optional = true }
mdctpsnr = { workspace = true, features = ["std", "parallel"], optional = true }
vmaf = { workspace = true, features = ["simd", "parallel"], optional = true }
nlpd = { path = "../nlpd", features = ["parallel"], optional = true }
piqe = { workspace = true, features = ["std"], optional = true }
niqe = { workspace = true, features = ["std"], optional = true }
brisque = { workspace = true, features = ["std"], optional = true }
zenjpeg = { path = "../../../zenjpeg/zenjpeg", default-features = false, features = ["zencodec"] }
zenpng = { path = "../../../zenpng", optional = true }
zenwebp = { path = "../../../zenwebp", default-features = false, optional = true }
zenjxl = { path = "../../../zenjxl", default-features = false, features = ["decode"], optional = true }
zenpixels = { version = ">=0.2.16, <0.4.0" }
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["hdr-experimental"] }
enough = "0.4.5"
how-far = "0.1.0"
zensim = { workspace = true, features = ["training", "feature-regime-v2", "custom-profiles", "deprecated-profiles", "candidate-profiles"] }
wasm-bindgen = "=0.2.129"
rayon = "1.12.0"
# The CLI metric sources compiled in through `#[path]` (src/lib.rs) dispatch SIMD with archmage/magetypes
# (`#[attune]`, `attuned!`: flip.rs, ssimulacra1.rs) and call zenmetrics-math; they need these directly.
archmage = { workspace = true }
magetypes = { workspace = true }
zenmetrics-math = { path = "../zenmetrics-math", features = ["std"] }

[features]
# The `cfg(avx512)` arms of the included CLI kernels (the CLI's feature of the same name); no effect on wasm32.
avx512 = ["archmage/avx512", "magetypes/avx512", "zenmetrics-math/avx512"]
# Reuse the CLI's CPU dispatch and decoder sources without its networking,
# fleet process management or native-only command dependencies.
default = ["full"]
# The full module: every CPU metric the browser scores. The viewer loads it
# the first time a metric other than Zensim is chosen.
full = ["cpu-metrics", "cpu-cvvdp", "cpu-iwssim", "cpu-gmsd", "cpu-psnrhvs", "cpu-haarpsi", "cpu-fsim", "cpu-vsi", "cpu-msssim", "cpu-vif", "cpu-vifvec", "cpu-iwssim-piq", "cpu-mad", "cpu-mdctpsnr", "cpu-vmaf", "nr", "nn-prep", "png", "jpeg", "webp", "jxl"]
# The first-load module is built with `--no-default-features --features core`:
# the JPEG decoder and encoder and Zensim. PNG, WebP and JPEG XL uploads
# decode in the full module.
core = ["jpeg"]
# Input tensors for the learned metrics onnxruntime-web runs (nn_prep.rs).
nn-prep = []
# No-reference PIQE, NIQE and BRISQUE through the CLI's `nr` adapter.
nr = ["dep:piqe", "dep:niqe", "dep:brisque"]
cpu-metrics = ["dep:nlpd"]
cpu-cvvdp = []
cpu-iwssim = []
cpu-gmsd = ["dep:gmsd"]
cpu-psnrhvs = ["dep:psnrhvs"]
cpu-haarpsi = ["dep:haarpsi"]
cpu-fsim = ["dep:fsim"]
cpu-vsi = ["dep:vsi"]
cpu-msssim = ["dep:msssim"]
cpu-vif = ["dep:vif"]
cpu-vifvec = ["dep:vif"]
cpu-iwssim-piq = []
cpu-mad = ["dep:mad-iqa"]
cpu-mdctpsnr = ["dep:mdctpsnr"]
cpu-vmaf = ["dep:vmaf"]
png = ["dep:zenpng"]
jpeg = []
webp = ["dep:zenwebp"]
jxl = ["dep:zenjxl"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }

[lints]
workspace = true

[dev-dependencies]
imgref = { workspace = true }
# The browser_oracle example pins zensim's dispatch tier; this must be the
# archmage copy zensim links (registry 0.9.30), or the disable has no effect.
archmage-zensim = { package = "archmage", version = "=0.9.30" }
jxl-encoder = { path = "../../../jxl-encoder/jxl-encoder", default-features = false }
# nn_oracle scores the learned metrics natively on the rten engine.
zenmetrics-nn = { path = "../zenmetrics-nn" }

# The oracles exercise every metric, so they need the full module's features.
[[example]]
name = "browser_oracle"
required-features = ["full"]

[[example]]
name = "nn_oracle"
required-features = ["full"]

[[example]]
name = "loop_norm_calibrate"
required-features = ["full"]
