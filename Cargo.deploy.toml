# Minimal workspace for building the deployable job-system crates (Railway dashboard + fleet worker)
# in isolation. The full workspace can't build standalone: zenmetrics-cli path-deps the jxl-encoder
# sibling repo (outside this repo), absent from a deploy/cross/remote build context. These crates
# reach outside the repo for nothing. Builders cp this over Cargo.toml before `cargo build -p <crate>`:
#   - Railway: cargo build -p zenfleet-dash   (the dashboard)
#   - fleet boxes (arm-zen/Oracle/etc.): cargo build -p zenfleet-worker  (worker + jobexec bins)
[workspace]
members = [
    "crates/zenfleet-core",
    "crates/zenfleet-ledger",
    "crates/zenfleet-dash",
    "crates/zenfleet-worker",
    "crates/zenfleet-ctl",
]
resolver = "2"

# Mirrors Cargo.toml [workspace.lints] verbatim: member crates set `[lints] workspace = true`.
[workspace.lints.rust]
# unsafe belongs in the verified primitive crates (magetypes/archmage/
# disjointmut). FORBIDDEN by default; the members below carry an explicit
# `[lints.rust] unsafe_code = "allow"` for their existing GPU-dispatch /
# FFI-oracle / SIMD debt — treat each allow as debt to remove, not a license.
unsafe_code = "forbid"
# pub items nothing outside the crate can reach -> should be pub(crate);
# the compiler-enforced half of AGENTS.md's API policy.
unreachable_pub = "warn"
# The opt-in `avx512` feature cfg is used by archmage incant! dispatch in the
# metric crates (previously each carried a crate-local [lints.rust] allow).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("avx512"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# pedantic/nursery stay off: too noisy for ported numeric code.
# Ported-code allows (the zenjpeg-proven list; see zenutils/quality/templates):
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
excessive_precision = "allow"
unreadable_literal = "allow"
approx_constant = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
uninlined_format_args = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.package]
authors = ["Imazen <support@imazen.io>"]
homepage = "https://github.com/imazen/zenmetrics"
repository = "https://github.com/imazen/zenmetrics"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", default-features = false, features = ["color", "derive", "error-context", "help", "std", "usage", "wrap_help"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
