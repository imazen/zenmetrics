archmage = { git = "https://github.com/imazen/archmage", rev = "da0ed5deca40ac60df32dcf4f6e7602658b2f959", version = "0.9.31-beta.1", features = ["macros", "avx512"] }
magetypes = { git = "https://github.com/imazen/archmage", rev = "da0ed5deca40ac60df32dcf4f6e7602658b2f959", version = "0.9.31-beta.1", features = ["avx512"] }
