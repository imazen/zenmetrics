exclude = [
    # Separately pinned CLI runner checkout used only by checkpoint CI.
    "runner-source",
    # Frozen Margarine research dependency graph and CPU-only command.
    "crates/margarine",
    # Lean, statically linked AV1 comparison executor; no GPU/corpus siblings.
    "benchmarks/av1-compare",
