# CubeCL — single source of truth for the GPU backend version.
#
# History:
#   - Phase 8f (2026-05-27) moved off `git = "lilith/cubecl"` rev pins onto
#     the crates.io publication of the `imazen/zenforks-cubecl` rename
#     (11 renamed crates at 0.10.1: pinned-upload + PTX cache widening +
#     Metal Atomic<f32> capability honesty).
#   - 2026-08-28 moved back to a git rev pin so the fork's post-0.10.1
#     commits are consumable without a crates.io release. See below.
# The [lib] name = "cubecl_*" shim in each renamed crate keeps source
# code paths like `use cubecl_runtime::*` resolving without changes.
# Full fork strategy + upstream resync log: the ZENFORKS_README.md in
# https://github.com/imazen/zenforks-cubecl.
# 2026-08-28 resync: switched from the crates.io 0.10.1 publication to a
# git rev pin on imazen/zenforks-cubecl main @ 92e4a157
# (crates version 0.10.2, deliberately NOT published — publishing is
# user-gated). This picks up the fork commits made after the 0.10.1
# publish wave: strict f64 handling on Metal (2509e67c / PR #2), the CPU
# implicit sync_cube fix, the EnumSet::difference fix, the worker-thread
# panic removal (385373f6), and the wgpu storage-binding alignment fix
# (f528c4b5) that makes cvvdp-gpu's Mode B strip-walker failure on Metal
# report its actual cause instead of a CallError unwrap (zenmetrics#24).
#
# cubecl-common and cubecl-ir are NOT renamed in the fork, but they must
# come from the SAME git source as the renamed crates — pulling them from
# crates.io instead would put two distinct `cubecl_ir` crates in the graph
# (same version, different source), and every `cubecl::ir::*` type
# zenmetrics passes across that boundary would fail to unify.
cubecl         = { package = "zenforks-cubecl",         git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false, features = ["std"] }
cubecl-runtime = { package = "zenforks-cubecl-runtime", git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
cubecl-core    = { package = "zenforks-cubecl-core",    git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
cubecl-cuda    = { package = "zenforks-cubecl-cuda",    git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
cubecl-cpu     = { package = "zenforks-cubecl-cpu",     git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
cubecl-wgpu    = { package = "zenforks-cubecl-wgpu",    git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
cubecl-hip     = { package = "zenforks-cubecl-hip",     git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
cubecl-cpp     = { package = "zenforks-cubecl-cpp",     git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c", default-features = false }
# Non-renamed leaves — same git source, see note above:
cubecl-common  = { git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c" }
cubecl-ir      = { git = "https://github.com/imazen/zenforks-cubecl", rev = "92e4a157e160198490b484618896d8dad0313e2c" }

# CPU reference crates used by parity tests.
butteraugli = { version = "0.9.4" }
# `threads` is required: the no-threads path calls into_par_iter unconditionally.
#
# Requirement is ^3.4, NOT ^3.5 (imazen/zenmetrics#43). ^3.5 made the whole
# workspace unresolvable on every box except the one dev machine that happens to
# hold an *unpushed* local dssim-core 3.5.0 — crates.io tops out at 3.4.0, so the
# patch below silently failed to apply anywhere else and cargo fell back to the
# index and errored, blocking crates that have nothing to do with dssim.
#
# ^3.4 is also the honest constraint: dssim-gpu's own lib.rs states its parity
# target is "the published dssim-core v3.4 crate", and the only surface it uses
# (`Dssim`, `ToRGBAPLU`, in tests/it/parity_lock.rs) is unchanged in 3.5 — that
# release is SIMD internals (tolab simd_x86/simd_neon). The patch below still
# wins where a newer sibling exists, so the primary box is unaffected.
#
# The path patch was removed in #43, so every box now resolves this same
# published 3.4.0 and Cargo.lock no longer churns between machines. To build
# against a local dssim checkout instead, use a GITIGNORED .cargo/config.toml
# `paths = [...]` override rather than re-adding a committed [patch] -- a
# committed patch is what made the workspace unresolvable everywhere the
# sibling was absent or the wrong version.
dssim-core = { version = "3.4", default-features = false, features = ["threads"] }
ssimulacra2 = { version = "0.5" }
zensim = { version = "0.3.0" }

# Common deps.
archmage = { version = "0.9.23", features = ["macros", "avx512"] }
magetypes = { version = "0.9.23", features = ["avx512"] }
bytemuck = "1"
clap = { version = "4", default-features = false, features = ["color", "derive", "error-context", "help", "std", "usage", "wrap_help"] }
csv = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imgref = "1"
indicatif = "0.17"
rgb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release profile — thin LTO + 16 codegen-units + line-tables-only debug.
#
# Why not `lto = "fat"` here:
#   - Fat LTO loads every CGU of every workspace member into a single
#     LLVM context during the final crate's link. With this workspace
#     (12 members, cubecl multi-backend, zenpixels, image codecs) plus
#     `debug = "full"` + `codegen-units = 1`, peak RSS during the
#     workspace-wide link routinely exceeded the 16 GB available on
#     `ubuntu-latest` GitHub runners. The CI workspace build was
#     gated off with `&& false` (ci.yml:55, since commit 4a729b65 on
#     2026-05-05) for exactly this reason.
#   - Thin LTO keeps ~85% of fat LTO's optimization wins (cross-CGU
#     inlining, dead-code elimination, devirtualization) but does the
#     work per-CGU rather than in one giant module, capping peak RSS.
#   - `debug = "line-tables-only"` instead of `"full"` keeps backtrace
#     line numbers (what `whereat` and panic reports need) without
#     dragging every DWARF DIE through the LTO link — that's the
#     other half of the OOM equation. Drop to `"none"` for even
#     smaller link memory if backtraces aren't needed.
#   - `codegen-units = 16` is the cargo default for release. With thin
#     LTO it lets LLVM parallelise the per-CGU optimisation passes.
#
# Need maximum optimisation for a shipping binary? Use `--profile
# release-fat` below. Benchmarks already opt into fat LTO via
# `[profile.bench]`.
[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "packed"
codegen-units = 16

# Fat-LTO release profile for production binaries on memory-rich
# hosts (the 7950X workstation, vast.ai builders). Same shape as the
# old `[profile.release]` minus `debug = "full"` (debug=full + fat LTO
# was the OOM trigger; full debuginfo on a release artefact is rarely
# what you actually want — split it out via `split-debuginfo` or use
# `--profile release-debug` if you really need it).
#
# Usage:
#   cargo build --profile release-fat -p zenmetrics-cli
#   cargo build --profile release-fat --workspace
[profile.release-fat]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Full-debuginfo release profile for `perf record` / heaptrack /
# callgrind sessions. Don't use this on CI runners — `debug = "full"`
# is what made the workspace-wide release link OOM on ubuntu-latest.
[profile.release-debug]
inherits = "release"
debug = "full"

# No-LTO profile for the GPU CI parity jobs (esp. macos-latest Metal). Those
# jobs build one test executable per `tests/*.rs` across the six `-gpu` crates
# (~129 link targets); under `[profile.release]`'s thin-LTO each of those links
# re-optimizes the whole cubecl/wgpu graph, which dominates the job's wall time
# (the deliberate `timeout-minutes: 40` is exceeded around cvvdp-gpu's 66 test
# files). Test binaries are never shipped, so LTO buys nothing here. `opt-level`
# stays 3 so host-side glue runs at a sane speed; `codegen-units = 256`
# parallelizes codegen; `debug = false` shrinks the link. Use `--profile
# gpu-citest`.
[profile.gpu-citest]
inherits = "release"
lto = false
codegen-units = 256
debug = false

[profile.bench]
opt-level = 3
lto = "fat"
debug = false
codegen-units = 1

# zensim 0.2.8 isn't on crates.io yet — pin to the main-branch commit
# that adds `compute_extended_features` (needed by the sweep
# subcommand's --feature-output sidecar). Drop this once 0.2.8 ships.
#
# jxl-encoder 0.3.2 (imazen/jxl-encoder#30 — two OOB index DoS
# fixes in entropy_coding/lz77.rs and vardct/patches.rs) is also
# not on crates.io yet — pinning to the main-branch commit that
# contains the merged fix so sweep workers stop crashing at the
# ~17% rate observed in v08/v09/v11. Drop this patch once 0.3.2
# publishes. Same patch applies transitively to zenjxl, which
# pulls jxl-encoder via Cargo.toml.
#
# 2026-05-18 (EXP-MULTI-CODEC): bumped from cb5d9e4 → 6b8eefc1 to
# pick up W44-1..W44-45 bench-driven RD changes on main. User
# explicitly requested "latest main jxlencoder which has a
# different rd than stored data" so the multi-codec sweep
# re-collects with the post-W44 RD curves rather than reusing
# the pre-W44 cached sidecars.
[patch.crates-io]
# DEV-ONLY (2026-08-29): zenjpeg 0.9.0 (synced) requires zenanalyze ^0.2.0,
# unpublished — supply the local sibling until the 0.2.0 publish. zenjpeg's
# own workspace uses a git rev for CI; a path-dep build root must patch here.
zenanalyze = { path = "../zenanalyze" }
# zenpixels / zenpixels-convert: previously git-rev-pinned (e890b671, 0.2.15)
# because ultrahdr-core needed an unpublished ^0.2.15. DROPPED 2026-07-27:
# 0.2.16 is on crates.io and the zenpng sibling now requires
# `zenpixels-convert >=0.2.16, <0.3`, which the old pin (0.2.15) conflicted
# with — crates.io 0.2.16 satisfies both it and ultrahdr-core's ^0.2.15.
# Local sibling of the canonical zensim repo. The feat/principled-activity
# branch landed on main weeks ago — the previous path-pin to
# ../zensim--principled-activity was carrying a stale checkout that
# would drift behind canonical on every push. Pointing at
# ../zensim/zensim (canonical main) means a `jj git fetch` in the
# zensim repo bubbles up to zenmetrics builds automatically.
#
# Equivalent git ref (use when the sibling checkout is gone):
#   { git = "https://github.com/imazen/zensim", rev = "<commit>" }
zensim = { path = "../zensim/zensim" }
# 2026-05-19: switched codec deps from crates.io + git-rev to local
# sibling worktrees so we always pick up in-flight improvements.
# User confirmed: "jxl encoder local has been improved, verify no
# crates.io codecs are used." These [patch.crates-io] entries
# substitute path deps for any workspace crate that depends on the
# corresponding crates.io version.
#
#   ~/work/zen/zenpng      (0.1.4)
#   ~/work/zen/zenwebp     (0.4.5)
#   ~/work/zen/zenavif     (0.1.6 — git tip; verify before next release)
#   ~/work/zen/zenjxl      (0.2.1 — git tip post 9ac0cd5a)
#   ~/work/zen/jxl-encoder (post 6b8eefc1 + local improvements)
#
# zenjpeg already uses an explicit `path = ../../../zenjpeg/zenjpeg`
# in zenmetrics-cli/Cargo.toml so it's not patched here.
# zenanalyze: same "a dependency's [patch] is ignored, only the root's counts"
# rule as rav1d-safe below. zenjpeg's 2026-08-28 zenanalyze migration made it
# take `zenanalyze = "0.2.0"` from the registry and supply the unpublished
# 0.2.x line through zenjpeg's OWN [patch.crates-io]; consumed here as a path
# dep, that patch does not apply, so every resolve failed with `failed to
# select a version for the requirement zenanalyze = "^0.2.0"` (crates.io
# latest is 0.1.0; the 0.2.x line lives on git until it publishes).
# PATH, not git: `zenfleet-vastai` (../../../zenanalyze) and the `zenavif`
# path dep already bind the local checkout, and ci.yml clones it to
# ../zenanalyze — a git patch would put a SECOND zenanalyze in the graph and
# nothing crossing between the two copies would type-unify.
# Drop when zenanalyze 0.2.0 publishes.
zenanalyze   = { path = "../zenanalyze" }
zenpng       = { path = "../zenpng" }
zenwebp      = { path = "../zenwebp" }
# zenavif: the former ../zenavif--main worktree (zenavif main) was
# removed by worktree cleanup; ../zenavif is now the source of truth —
# checked out at zenavif main (31a9b54), which retains `pub mod expert`
# + the `__expert` feature (Cargo.toml:149, src/lib.rs:73). The speed6
# branch that lacked both is no longer the ../zenavif checkout.
zenavif      = { path = "../zenavif" }
# rav1d-safe: DELIBERATELY NOT PATCHED, and this workspace CANNOT pin it.
# The entry that used to sit here —
#   rav1d-safe = { git = "…/rav1d-safe", rev = "f6aed27e81ba…" }
# — was dead, and its comment described a world zenavif has left. It read:
# "zenavif's OWN [patch.crates-io] pins this to git rev f6aed27e … a
# dependency's [patch] is ignored, only the root's counts … without
# replicating it, rav1d-safe resolves to crates.io ^0.5.3 → 11 compile errors
# in zenavif. Mirrors ../zenavif/Cargo.toml:301." Every clause of that is now
# false: zenavif deleted its crates-io patch and made rav1d-safe a DIRECT GIT
# DEP on its dependency line (../zenavif/Cargo.toml:95, and its own note at
# :565 records the removal), so nothing in this graph requires rav1d-safe from
# crates.io and a crates-io patch has nothing to replace. Cargo agreed: the
# entry was recorded as `[[patch.unused]]` in Cargo.lock and pinned nothing —
# the lock was resolving 140f9145, not f6aed27e, and the line number the
# comment mirrored had moved.
#
# A git-source patch does not work either. `[patch."https://github.com/imazen/
# rav1d-safe"] rav1d-safe = { git = <same url>, rev = <other> }` is REJECTED —
# measured 2026-08-29, `cargo metadata` exits 101 with "patch for `rav1d-safe`
# points to the same source, but patches must point to different sources".
# Cargo compares the patch's source by URL; `?rev=` is not part of that
# identity, so a same-repo-different-rev patch is not a distinct source. Only
# a `path`/other-URL patch would qualify, which would mean cloning rav1d-safe
# on every CI runner to pin a rev we do not otherwise need locally.
#
# So the rav1d-safe rev this workspace builds is OWNED BY ZENAVIF'S DEPENDENCY
# LINE, and the only lever this repo has is WHICH ZENAVIF it resolves against:
#   * locally — the sibling checkout, bound TWICE and at two different relative
#     depths: the `zenavif = { path = "../zenavif" }` entry just above, and
#     zenmetrics-cli's OWN direct `zenavif = { path = "../../../zenavif",
#     optional = true }` (crates/zenmetrics-cli/Cargo.toml). The direct dep is
#     the one that actually binds for the CLI — a root patch does not override
#     a path dep — so repointing only the entry above does nothing;
#   * in CI  — the pinned `git clone …/zenavif.git ../zenavif` +
#     `git -C ../zenavif checkout <rev>` in .github/workflows/ci.yml (all five
#     copies of the "Clone sibling-repo path-dep targets" step).
# Those two silently drifted apart, which is how the dead entry above went
# unnoticed. Treat the CI zenavif pin as the rav1d-safe pin, and re-check the
# rev on ../zenavif/Cargo.toml:95 whenever you move it.
# zenrav1e: ../zenavif -> ravif (zenravif 0.2.0, ../ravif/ravif) depends on
# zenrav1e = "0.2.0" BY CRATES.IO VERSION, but only 0.1.4 is published, so a
# fresh resolve fails (`failed to select a version for zenrav1e = ^0.2.0`).
# The local ../zenrav1e IS 0.2.0 — pin it here so the avif chain resolves
# (the "unpublished dep -> patch it in, don't stall" rule). Dev-only: drop
# this when zenrav1e 0.2.0 (and zenravif 0.2.0) publish to crates.io.
# Equivalent git ref when the sibling checkout is gone:
#   { git = "https://github.com/imazen/zenrav1e", rev = "<commit>" }
zenrav1e     = { path = "../zenrav1e" }
# zenavif-serialize: ../ravif/ravif (zenravif 0.2.0) bumped its own
# requirement to `zenavif-serialize = "0.2.0"` (needed for
# `set_gain_map_alt_icc`) — the ravif Cargo.toml comment says as much:
# "supplied by [patch.crates-io] until 0.2.0 publishes". Only 0.1.4 is
# published, so a fresh resolve fails (`failed to select a version for
# zenavif-serialize = ^0.2.0`), which breaks resolution for the ENTIRE
# workspace (not just avif-touching members) because Cargo resolves
# the full dependency graph up front. The local ../zenavif-serialize
# checkout IS 0.2.0 — pin it here so the avif chain resolves (the
# "unpublished dep -> patch it in, don't stall" rule). Dev-only: drop
# this once zenavif-serialize 0.2.0 publishes to crates.io.
# Equivalent git ref when the sibling checkout is gone:
#   { git = "https://github.com/imazen/zenavif-serialize", rev = "<commit>" }
zenavif-serialize = { path = "../zenavif/zenavif-serialize" }
# zenavif-parse: deliberately NOT patched. ../zenavif absorbed it as a
# workspace member on 2026-07-16 and declares it as
# `zenavif-parse = { version = "0.7.0", path = "zenavif-parse" }`, so the
# avif chain gets 0.7.0 from zenavif's own member — a crates.io patch here is
# never consulted. A `[patch.crates-io] zenavif-parse = { path =
# "../zenavif-parse" }` entry existed briefly (0c9b16f5) and did nothing but
# break CI: Cargo.lock recorded it as `[[patch.unused]]`, while cargo still
# had to stat the path up front, so every platform died with "failed to load
# source for dependency `zenavif-parse`" (the sibling is not cloned in CI, and
# the standalone imazen/zenavif-parse repo is now a moved-to-zenavif pointer).
# If a patch is ever genuinely needed again, add the matching sibling clone to
# EVERY bootstrap block in .github/workflows/ci.yml in the same commit.
# zenjxl: the canonical ../zenjxl checkout (now carries the
# AnimationParams/AnimationFrame API for jxl-encoder 0.3.2). The
# former ../zenjxl--main worktree was removed by worktree cleanup;
# ../zenjxl is the source of truth.
zenjxl       = { path = "../zenjxl" }
# zenjxl-decoder: 0.3.10 published 2026-06-11 (the orientation API that
# previously forced a path patch), but zenjxl main moved again the next
# day — b04ca75 (2026-06-12) gates allow_progressive during decode via
# `JxlDecoderOptions::reject_progressive`, which is on the decoder's main
# (966f9c5) but NOT in the published 0.3.10. zenjxl's own workspace
# carries the same patch; cargo patches don't propagate across
# workspaces, so without this entry the zenmetrics workspace resolves
# crates.io 0.3.10 and zenjxl fails to compile (E0609 reject_progressive).
# 2026-06-18: zenjxl main (3ad46e1) advanced again — #14 (c560121) + #15
# (5d33e76) migrated the decoder boundary to whereat `At<Error>` (decode
# returns are `At`-wrapped; zenjxl calls `.map_error()` / `.map_err_at()`).
# The old git-rev pin 0bd33d21 predates the migration, so zenjxl failed to
# compile (E0599 map_err_at/map_error). 2026-06-19: re-pinned from the
# sibling-path-patch hold to a PUSHED decoder rev that carries the At<Error>
# migration — 0599dcf is zenjxl-decoder origin/main (#29 changelog tip), so
# cargo fetches it itself and CI needs no sibling clone (matches the comment
# at the clone step in .github/workflows/ci.yml).
# 2026-08-27: zenjxl main (9226d3a, the zencodec 0.1.26 build) now REQUIRES
# `zenjxl-decoder = "0.4.0"` (the `jxl::api::ErrorClass` taxonomy its
# error.rs matches on + `reject_progressive`), which is unpublished
# (crates.io latest: 0.3.10) — zenjxl carries a sibling-path patch for it
# that this workspace ignores, and the old 0599dcf rev is 0.3.10, so the
# workspace could no longer resolve at all. Re-pinned to f1faec7 =
# zenjxl-decoder origin/main, version 0.4.0. Drop this patch when
# zenjxl-decoder 0.4.0 publishes AND zenjxl bumps its `jxl` dep to it.
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "f1faec70e41b0c1f31e9db3d2142071bf02d08d5" }
jxl-encoder  = { path = "../jxl-encoder/jxl-encoder" }
# butteraugli: the local sibling at ~/work/butteraugli/butteraugli is
# version 0.9.2 but carries `compare_linear_planar_into` (the recycled-
# buffer planar-compare production path) which the PUBLISHED crates.io
# 0.9.2 does NOT expose. jxl-encoder (patched above) calls it from its
# vardct perceptual backend (perceptual_backend.rs:637); without this
# patch the workspace unifies on crates.io 0.9.2 and the jxl-encoder
# build fails `no method compare_linear_planar_into`. This points
# zenmetrics at the SAME local sibling jxl-encoder's own Cargo.toml uses
# (../../butteraugli/butteraugli from each repo root), so the whole
# workspace resolves one butteraugli. Equivalent git ref when the
# sibling checkout is gone: { git = "https://github.com/imazen/butteraugli", rev = "<commit>" }.
butteraugli  = { path = "../../butteraugli/butteraugli" }
# dssim-core: NO patch here on purpose (#43). This used to point at the local
# sibling ~/work/dssim/dssim-core so dssim scores used local source rather than
# the crates.io artifact. The intent is right -- the standing rule is to verify
# zen-family deps against local sources -- but a committed [patch] is the wrong
# mechanism for it: it is checked in, so every box and CI runner that lacks the
# sibling (or has it at a different version) fails workspace resolution, which
# is exactly what #43 was. The sibling here was an UNPUSHED 3.5.0 that existed
# on one machine, and that machine has no NVIDIA GPU, so the dssim-gpu parity
# tests which actually consume dssim-core could never run against it.
#
# For a local-source build, use a gitignored .cargo/config.toml:
#     [paths]  ->  paths = ["../../dssim/dssim-core"]
# which overrides the dep for YOUR builds only and leaves CI on the registry.
# fast-ssim2: the CPU integrated-PU21 HDR entry
# (`fast_ssim2::compute_ssimulacra2_pu_nits`, behind the `hdr-pu` feature) is
# git-main-only — crates.io 0.8.1 predates it. zenmetrics-api's cpu-ssim2
# routes `hdr_feeding(Ssim2, Backend::Cpu)` through that entry (the u8
# PU-shell front-end capped at ~0.61 UPIQ-class vs 0.7044 integrated, #25),
# so the workspace pins the sibling package dir — the SAME path
# zenmetrics-cli's direct dep already uses (../../../fast-ssim2/fast-ssim2
# from its crate dir), keeping one fast-ssim2 in the graph. CI clones
# imazen/fast-ssim2 at a pinned rev (see .github/workflows/ci.yml).
# Equivalent git ref (use when the sibling checkout is gone):
#   { git = "https://github.com/imazen/fast-ssim2", rev = "8c9b16d2f4ab6055bfa22d8b4a079a8778f285ec" }
# Drop this patch when a fast-ssim2 release ships `hdr-pu` (0.8.2+) and the
# api/orchestrator deps move back to the registry version.
fast-ssim2   = { path = "../fast-ssim2/fast-ssim2" }
