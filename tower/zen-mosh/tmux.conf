# zen-mosh gateway: every pane/window is a host-namespace root shell.
# default-shell MUST be a plain container shell: tmux spawns panes via
# "<default-shell> -c <default-command>", and root's login shell (tmux-host)
# would nsenter to the host BEFORE hostshell (a container path) is resolved.
set -g default-shell "/bin/bash"
set -g default-command "/usr/local/bin/hostshell"
set -g history-limit 50000
