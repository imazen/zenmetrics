# deny.toml — cargo-deny policy for the zenmetrics workspace. Advisory in the
# quality suite (`just quality`); template: zenutils/quality/templates/deny.toml.

[graph]
all-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# Paste 1.0.15 is unmaintained-but-stable, pulled transitively by the AV1
# encoder ports. Maintenance flag, not a CVE — same resolution as heic's.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
    "CC0-1.0", "0BSD", "MPL-2.0", "BSL-1.0", "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.93
# Most members are publish=false — private crates get no license audit.
# The publishable members (zenfleet-* , zenstats) are all MIT OR Apache-2.0.
private.ignore = true
# If a publishable crate gains a non-allowlisted license, add an explicit
# exception rather than widening `allow`:
# exceptions = [
#     { allow = ["AGPL-3.0-only", "LicenseRef-Imazen-Commercial"], name = "mycrate" },
# ]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "openssl-sys" },
    { name = "ring", version = "<0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Pinned git sources used by Cargo.toml (zenforks-cubecl fork, unpublished
# zenjxl-decoder 0.4.0, sibling codec pins). Keep in sync with Cargo.toml.
allow-git = [
    "https://github.com/imazen/zenforks-cubecl",
    "https://github.com/imazen/zenpixels",
    "https://github.com/imazen/zenjxl-decoder",
    "https://github.com/imazen/butteraugli",
    "https://github.com/imazen/fast-ssim2",
    "https://github.com/imazen/zenavif-serialize",
    "https://github.com/imazen/zenrav1e",
    "https://github.com/imazen/zensim",
    "https://github.com/imazen/zenresize",
    "https://github.com/imazen/zenav1-svt",
    "https://github.com/imazen/zenbench",
]
