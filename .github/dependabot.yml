# Dependabot was previously UNCONFIGURED here: the repo received security
# alerts (which need no config) but no scheduled version updates. That is
# how the arrow/parquet line drifted far enough that closing CVE-2026-43868
# needed a 58 -> 59 major bump rather than a lockfile refresh, and how two
# stale lockfile PRs (#35, #39) sat open past the versions they proposed.
#
# Grouped so a week produces a handful of reviewable PRs rather than dozens,
# and so lockstep families (arrow + parquet; the cubecl forks) move together
# instead of arriving as individually-unmergeable bumps.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    assignees: ["lilith"]
    groups:
      arrow-parquet:
        patterns: ["arrow", "arrow-*", "parquet"]
      aws-sdk:
        patterns: ["aws-*", "object_store"]
      patch-and-minor:
        update-types: ["minor", "patch"]
    ignore:
      # Sibling path-deps and the zenforks-cubecl git pins are driven by
      # their own repos / the CI pin block in ci.yml, not by dependabot.
      - dependency-name: "zenforks-cubecl*"
      - dependency-name: "cubecl*"

  # The four standalone lockfiles outside the root workspace. Each has its
  # own resolution graph, so each needs its own entry -- the root entry does
  # not reach them (that is why #35's quinn-proto bump was filed against
  # crates/burn-ranknet-spike separately).
  - package-ecosystem: cargo
    directory: "/apidoc"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: ["dependencies", "rust"]
    assignees: ["lilith"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/benchmarks/av1-compare"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: ["dependencies", "rust"]
    assignees: ["lilith"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/crates/burn-conv-spike"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: ["dependencies", "rust"]
    assignees: ["lilith"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/crates/burn-ranknet-spike"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: ["dependencies", "rust"]
    assignees: ["lilith"]
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/crates/zenfleet-dash/web"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: ["dependencies", "javascript"]
    assignees: ["lilith"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      radix:
        patterns: ["@radix-ui/*"]
      build-tooling:
        patterns: ["vite", "@vitejs/*", "typescript", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    assignees: ["lilith"]
    groups:
      actions:
        patterns: ["*"]
