name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CI: true

defaults:
  run:
    shell: bash

# Superseded runs only waste runner queue — particularly the macOS
# jobs, which wait on GitHub's scarcest pool. Only the newest
# commit's run matters per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Machine-enforced "ONE ghcr package per artifact, variants are TAGS" rule — FAILS if any scripts/*.sh
  # hard-codes a non-canonical ghcr.io/imazen image name. This is the rule that doc-alone failed to hold
  # (5 worker renames + 4 sweep renames); see scripts/jobsys/fleet.env for the single source of truth.
  canonical-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/jobsys/check_canonical_images.sh

  # hygiene: address/identifier check. Global CLAUDE.md forbids household and
  # home-network identifiers in a public repo; on 2026-09-06 an audit found the
  # class live here and in the sibling repo, spread by COPYING one documented
  # example. Patterns: scripts/lib/hygiene_patterns.txt (the same file
  # scripts/safe_push.sh reads for its pre-push gate). The self-test runs first
  # so a broken pattern set fails loudly instead of silently passing everything.
  hygiene-check:
    name: "hygiene: address/identifier check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/ci/check_hygiene.py --self-test
      - run: python3 scripts/ci/check_hygiene.py

  # Workspace-wide compile check across the platforms CLAUDE.md mandates:
  # linux-x86_64, windows-11-arm, macos-15-intel, macos-26-intel.
  # We compile with the WGPU backend (no system CUDA needed) so this works
  # on every runner without per-OS toolchain setup.
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # linux-x86_64
          - windows-latest       # windows-x86_64
          - windows-11-arm       # windows-arm64 (per CLAUDE.md)
          - macos-15-intel       # macos-x86_64
          - macos-26-intel       # macos-x86_64 (newer image)
          - macos-latest         # macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling-repo path-dep targets (pinned in ci/sibling-pins.tsv)
        # Every sibling repository the workspace path-deps / [patch]es, at the revision
        # ci/sibling-pins.tsv pins (that file carries the per-pin reasons). The same file
        # drives scripts/ci/lock.sh, which proves Cargo.lock resolves against exactly
        # these revisions — change pins THERE, not here.
        run: bash scripts/ci/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenmetrics-${{ matrix.os }}
      # `just test-tmpdir-discipline` below needs the `just` command-runner, which
      # is NOT preinstalled on GitHub-hosted ubuntu-latest runners (unlike cargo/
      # git). This was unreachable before the zenav1-aom/zenbitmaps manifest-load
      # fix above — every job died before getting here — so it never surfaced
      # until now: "just: command not found", exit 127. taiki-e/install-action
      # fetches a prebuilt binary (no compile) for exactly this class of Rust CLI
      # tool. ubuntu-only: the only matrix leg that runs a `just` recipe.
      - uses: taiki-e/install-action@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          tool: just
      - name: Run fleet-orchestration tests (pure-logic; no cloud, no GPU, no secrets)
        # The orchestration heart: reconcile/gap convergence + retry/poison, the
        # lease/claim exactly-once logic, idle + startup-failure detection, the
        # ledger latest-wins fold, GC keep/evict, the local-backend e2e
        # (declare->claim->execute->ledger->reconcile to convergence), and each
        # provider's parse/launch marshaling. ~274 deterministic sub-15s tests that
        # need no secrets. CI previously only *compiled* these (--all-targets) and
        # never RAN them, so a broken test shipped green (e.g. tests/e2e_sim.rs
        # stopped compiling when DesiredJob gained the `hint` field — fixed 2026-06-25
        # by switching it to DesiredJob::new()). Run them here so that can't recur.
        # Placed BEFORE the heavy cuda build so the gate fires regardless of its
        # health. Ubuntu-only: the logic is platform-independent and the matrix
        # above compiles it everywhere. (vastai runs feature-light to skip the GPU/
        # codec tree; --no-default-features --features worker keeps its claim/parse/
        # dispatch tests without cubecl.) TODO: extend the RUN to windows-11-arm +
        # macos-15-intel per CLAUDE.md once verified green there.
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --no-fail-fast \
            -p zenfleet-core -p zenfleet-ledger -p zenfleet-worker -p zenfleet-ctl \
            -p zenfleet-cloud -p zenfleet-hetzner -p zenfleet-local -p zenfleet-dash \
            -p zenfleet-sim
          cargo test --no-fail-fast -p zenfleet-vastai --no-default-features --features worker
      - name: TMPDIR discipline (fleet-entrypoint.sh must reject unset/tmpfs TMPDIR)
        # Shell-level companion to the Rust suite above: proves check_tmpdir_discipline
        # (crates/zenfleet-worker/tmpdir_discipline.sh, sourced by fleet-entrypoint.sh at
        # boot) actually rejects an unset or RAM-backed TMPDIR instead of silently
        # defaulting to /tmp. Pure-logic, no cloud, no GPU, no secrets.
        if: matrix.os == 'ubuntu-latest'
        run: just test-tmpdir-discipline
      - name: Install libvmaf build tools (ubuntu)
        # `vmaf-head-sys` (a dev-dependency of the vmaf and msssim crates, the libvmaf
        # parity oracle) compiles libvmaf with Meson + Ninja + NASM (x86) in its build
        # script; the ubuntu runner ships none of them, and `--all-targets` below builds
        # dev-dependencies ("Meson is required to build vmaf-head-sys ... 'meson' was
        # not found"). `xxd`, also required, is preinstalled.
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm
      - name: Build workspace (wgpu + cpu, build-only)
        # Disabled until 2026-05-26 because `[profile.release]` carried
        # `lto = "fat"` + `debug = "full"` + `codegen-units = 1`, which
        # OOM'd the 16 GB ubuntu-latest runner at the final LTO link.
        # Workspace profile now uses thin LTO + line-tables-only debug
        # + cu=16 (task #59) — peak LTO link RSS dropped ~74% per
        # local measurement on the 7950X sandbox. If this step OOMs
        # again, run `cargo build --release --workspace ...` locally
        # with `/usr/bin/time -v` to capture peak RSS and check
        # whether a new heavy member (cubecl backend? trie of generic
        # GPU kernels?) regressed the link memory.
        run: cargo build --workspace --no-default-features --features cuda,all-metrics --release --all-targets
        if: matrix.os == 'ubuntu-latest'
      - name: Build all -gpu crates (wgpu only)
        run: |
          cargo build -p butteraugli-gpu --no-default-features --features wgpu --release
          cargo build -p ssim2-gpu       --no-default-features --features wgpu --release
          cargo build -p dssim-gpu       --no-default-features --features wgpu --release
          cargo build -p zensim-gpu      --no-default-features --features wgpu --release
          cargo build -p cvvdp-gpu       --no-default-features --features wgpu --release
      - name: Build + test cvvdp pure-CPU (renamed from cvvdp-cpu; no GPU runtime)
        run: |
          cargo build -p cvvdp --release
          cargo build -p cvvdp --no-default-features --features "alloc parallel" --release
          cargo test  -p cvvdp --release
      # hdrvdp is the f64 CPU reference port of HDR-VDP-2.2 (zenmetrics#50):
      # no features, no dependencies, no GPU runtime. The workspace build above
      # compiles it but nothing ran its tests, so they are run here — including
      # `tests/corpus_ladder.rs`, the end-to-end gate on real corpus pixels.
      - name: Test hdrvdp pure-CPU reference port (no GPU runtime)
        run: cargo test -p hdrvdp --release
      - name: Build CLI (CPU metrics only — no GPU runtime needed at compile time)
        run: cargo build -p zenmetrics-cli --no-default-features --features cpu-metrics --release

  # Runtime parity tests on macOS via Metal (the only CI-available GPU
  # runtime). Disable `fast-reduction` everywhere — Metal silently
  # no-ops Atomic<f32>::fetch_add (gotcha G3.x); the portable two-stage
  # reduction is what actually works. Root cause + fix tracked in
  # `crates/zenmetrics-api/docs/CUBECL_METAL_ATOMIC_FIX.md` (Phase 8e.4).
  #
  # Runs on macos-latest (Apple Silicon) only — the sole GitHub runner with a
  # real Metal GPU. The Intel-Mac runners (macos-15/26-intel) expose only a
  # 64 MB "Apple Paravirtualized Graphics Device" (per the job's own GPU-info
  # step) on which cubecl-wgpu stalls allocating our multi-scale pyramids —
  # both Intel legs ran 6h05m and hit the default 360-min job ceiling on every
  # push (premium macOS minutes), so they were dropped from this matrix on
  # 2026-06-03 (#20). Intel-Mac coverage is retained by the Compile job, which
  # builds `--all-targets` on macos-15-intel + macos-26-intel.
  metal-tests:
    name: Metal tests (${{ matrix.os }})
    # DISABLED 2026-06-13 — the macos-latest (8 GB unified) GPU wedges on
    # the 12 MP (4000×3000) parity tests: butteraugli-gpu's whole-image
    # score returns 0 (silent OOM) and ssim2-gpu hangs the Metal device
    # hard enough to ride the job timeout, even with RUST_TEST_THREADS=1.
    # This is a runner-capacity / large-image-GPU-memory issue, not a
    # kernel-correctness one (CUDA + Vulkan parity is green). GPU metric
    # parity is covered on CUDA/Vulkan locally + in the gpu-citest job
    # below. Re-enable when the large-image path is capped/fixed for the
    # 8 GB runner — tracked in the zenmetrics#24 Metal stream. See the
    # README "GPU CI / Metal" note.
    #
    # STILL DISABLED after the 2026-08-28 Metal pass (#24). The 8 GB
    # capacity problem above is now only ONE of three blockers, and it is
    # no longer the binding one — these two would make the job red at any
    # resolution budget, so capping the grid alone does NOT unblock it:
    #
    #   1. iwssim-gpu `opaque::opaque_gray_f32_identity_and_typed_parity`
    #      fails deterministically on Metal (0.9999679561389043, wants
    #      < 0.999). Root-caused 2026-08-28 to the `compute_gray_f32`
    #      INGRESS, not to Metal: on the same content the GPU u8 path
    #      scores 0.98448 and the CPU reference 0.98579, while the f32
    #      path returns ~identity. iwssim-gpu IS in this matrix.
    #   2. zensim-gpu has 2 deterministic Metal failures
    #      (`diffmap_invariants::invariant_1_identity_yields_near_zero_diffmap`,
    #      `cached_ref_slot_rebuild::gpu_score_correct_after_foreign_size_rebuild`).
    #      zensim-gpu IS in this matrix.
    #
    # Both are written up in CLAUDE.md "Known Bugs" with reproductions.
    # Re-enabling before they are FIXED would just add a permanently-red
    # job; the only ways to make it green today would be to weaken the
    # parity assertions or `#[ignore]` the tests, and neither is
    # acceptable. Order of work to unblock: fix (1) and (2), then split
    # the parity grid by resolution so the 12 MP cells run only where
    # they fit, then flip this back on with rust-cache
    # `cache-on-failure: true`.
    if: false
    runs-on: ${{ matrix.os }}
    # Fail-fast safety net (belt-and-suspenders now that Intel is dropped): a
    # future GPU-init regression on macos-latest dies at 40 min instead of
    # riding the default 360-min ceiling. 40 min covers a cold gpu-citest build
    # plus the parity tests (fast when the GPU works).
    timeout-minutes: 40
    env:
      # Serialize test execution on Metal. After the tests/it consolidation
      # (162→9 binaries, 42a107b1) ssim2-gpu's it binary runs 97 tests in one
      # process; with libtest's default parallelism the concurrent Metal
      # context/buffer churn wedges the macos-latest runner — observed since
      # 2026-06-10 as either an indefinite hang in `ssim2-gpu parity` (job
      # rides the timeout) or a host-level shutdown (exit 143 ~3 min into the
      # suite; run 27312175768). Compilation is NOT the cost: gpu-citest
      # builds ssim2-gpu in <2 min. One test at a time keeps exactly the same
      # assertions and converts a wedge into a readable pass/fail.
      RUST_TEST_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling-repo path-dep targets (pinned in ci/sibling-pins.tsv)
        # Every sibling repository the workspace path-deps / [patch]es, at the revision
        # ci/sibling-pins.tsv pins (that file carries the per-pin reasons). The same file
        # drives scripts/ci/lock.sh, which proves Cargo.lock resolves against exactly
        # these revisions — change pins THERE, not here.
        run: bash scripts/ci/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenmetrics-metal-${{ matrix.os }}
      - name: GPU info
        run: system_profiler SPDisplaysDataType | head -40 || true
      - name: butteraugli-gpu parity
        if: always()
        # `--tests` runs the parity test targets (lib unit + integration) and
        # skips examples — the cuda-only bench examples (`use cubecl::cuda`) don't
        # compile under wgpu and aren't the parity surface this job validates.
        run: cargo test -p butteraugli-gpu --no-default-features --features wgpu --profile gpu-citest --tests
      - name: ssim2-gpu parity
        if: always()
        # `--tests` runs the parity test targets (lib unit + integration) and
        # skips examples — the cuda-only bench examples (`use cubecl::cuda`) don't
        # compile under wgpu and aren't the parity surface this job validates.
        #
        # ZENMETRICS_GPU_TIMING=1 + `--nocapture`: surface the gpu-core
        # `time_phase` breakdown (`ssim2.compute_with_mode`) so the macos-Metal
        # *runtime* cost is visible in the log. Measured 2026-06-12 (run
        # 27312175768): gpu-citest compiles this crate in <2 min — wall time
        # here is test execution, which is why the job-level
        # RUST_TEST_THREADS=1 serialization matters on this step.
        env:
          ZENMETRICS_GPU_TIMING: "1"
        run: cargo test -p ssim2-gpu --no-default-features --features wgpu --profile gpu-citest --tests -- --nocapture
      - name: dssim-gpu parity
        if: always()
        # `--tests` runs the parity test targets (lib unit + integration) and
        # skips examples — the cuda-only bench examples (`use cubecl::cuda`) don't
        # compile under wgpu and aren't the parity surface this job validates.
        run: cargo test -p dssim-gpu --no-default-features --features wgpu --profile gpu-citest --tests
      - name: zensim-gpu parity
        if: always()
        # `--tests` runs the parity test targets (lib unit + integration) and
        # skips examples — the cuda-only bench examples (`use cubecl::cuda`) don't
        # compile under wgpu and aren't the parity surface this job validates.
        run: cargo test -p zensim-gpu --no-default-features --features wgpu --profile gpu-citest --tests
      - name: iwssim-gpu parity
        # iwssim-gpu has no Atomic<f32> use in its hot path (audited
        # 2026-05-27 as part of Phase 8e.4 — see CUBECL_METAL_ATOMIC_FIX.md),
        # so it's safe to add to the metal-tests matrix even pre-upstream-fix.
        if: always()
        # `--tests` runs the parity test targets (lib unit + integration) and
        # skips examples — the cuda-only bench examples (`use cubecl::cuda`) don't
        # compile under wgpu and aren't the parity surface this job validates.
        run: cargo test -p iwssim-gpu --no-default-features --features wgpu --profile gpu-citest --tests
      # cvvdp-gpu deliberately omitted from metal-tests. Its old production
      # pool (pool_band_3ch_lds_kernel, Atomic<f32>::fetch_add) collapsed
      # Metal scores to the default JOD value. Since 2026-09-26 the pool
      # (pool_rows_3ch_kernel + pool_rows_finalize_kernel) uses no float
      # atomics, but it has not been run on Metal, and the multi-strip
      # Mode B tests fail there on unaligned offset_start bindings (CLAUDE.md
      # Known Bugs). The lib.rs module-doc directs Metal users to
      # compute_dkl_jod_host_pool, which pools on the host.

  # Compile-only doctest pass — catches the doc examples in lib.rs that
  # reference `WgpuRuntime` etc. CUDA-only environments would skip these,
  # so we run them on macOS.
  doctests:
    name: Doctests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling-repo path-dep targets (pinned in ci/sibling-pins.tsv)
        # Every sibling repository the workspace path-deps / [patch]es, at the revision
        # ci/sibling-pins.tsv pins (that file carries the per-pin reasons). The same file
        # drives scripts/ci/lock.sh, which proves Cargo.lock resolves against exactly
        # these revisions — change pins THERE, not here.
        run: bash scripts/ci/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenmetrics-doctests
      - name: Install libvmaf build tools (macOS)
        # `cargo test --doc` builds the workspace crates with their dev-dependencies, so
        # `vmaf-head-sys` (libvmaf via Meson + Ninja; NASM is only used on x86) is compiled
        # here and fails with "Meson is required to build vmaf-head-sys" on a bare runner.
        run: brew install meson ninja nasm
      - name: Run doctests
        run: cargo test --workspace --no-default-features --features wgpu,all-metrics --doc --release

  # zenmetrics-api optimized-CPU backend tests (task #159 phase 5). Runs
  # the Backend::Cpu dispatch suite + the backend×metric×size matrix on a
  # GPU-less runner. Built with `wgpu` (so the -gpu crates compile without
  # the CUDA SDK) but `cuda` OFF, so the matrix's CPU-vs-CUDA parity layer
  # (`#[cfg(feature = "cuda")]`) compiles out — a visible feature gate, not
  # a runtime graceful skip. The Backend::Cpu path uses the optimized
  # native crates (fast-ssim2, in-tree cvvdp/iwssim, dssim-core,
  # butteraugli, zensim) and needs no GPU at runtime.
  cpu-metrics-tests:
    name: CPU-metrics tests (zenmetrics-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling-repo path-dep targets (pinned in ci/sibling-pins.tsv)
        # Every sibling repository the workspace path-deps / [patch]es, at the revision
        # ci/sibling-pins.tsv pins (that file carries the per-pin reasons). The same file
        # drives scripts/ci/lock.sh, which proves Cargo.lock resolves against exactly
        # these revisions — change pins THERE, not here.
        run: bash scripts/ci/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenmetrics-cpu-metrics
      - name: Backend::Cpu dispatch + backend×metric×size matrix
        run: |
          cargo test -p zenmetrics-api \
            --no-default-features \
            --features all-metrics,cpu-metrics,wgpu,pixels,encoded \
            --test it -- backend_matrix cpu_dispatch cpu_ssim2_pu cpu_zensim_pu
      # hdrvdp — the f64 CPU reference port of HDR-VDP-2.2 (zenmetrics#50). No
      # features, no dependencies, no GPU runtime, so it belongs on a CPU job.
      # It runs HERE rather than only next to the cvvdp CPU tests in the
      # Compile job because that job's earlier "fleet-orchestration tests" step
      # is red on ubuntu for a pre-existing, unrelated reason (the
      # zenfleet-worker watchdog test — see CLAUDE.md "Known Bugs"), which
      # skips every step after it. This job is green, so the gate is real.
      # Includes `tests/corpus_ladder.rs`, the end-to-end score on real corpus
      # pixels.
      - name: hdrvdp reference port (pure CPU)
        run: cargo test -p hdrvdp --release

  # Linting + formatting.
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling-repo path-dep targets (pinned in ci/sibling-pins.tsv)
        # Every sibling repository the workspace path-deps / [patch]es, at the revision
        # ci/sibling-pins.tsv pins (that file carries the per-pin reasons). The same file
        # drives scripts/ci/lock.sh, which proves Cargo.lock resolves against exactly
        # these revisions — change pins THERE, not here.
        run: bash scripts/ci/clone-siblings.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: zenmetrics-lint
      - name: Format check
        # Scope to in-repo workspace members only — `cargo fmt --all` reaches
        # into the patched sibling repos (../zenavif, …) we don't own and fails
        # on THEIR formatting. `cargo metadata --no-deps` lists exactly this
        # workspace's members (matches the `just fmt-check` recipe).
        run: cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name | "-p " + .')
      - name: Clippy (-D warnings, workspace-wide)
        # Intentional/precision/cosmetic lints are allowed. Two mechanisms:
        # command-line -A here covers the many non-`warn(clippy::all)` crates;
        # the warn-all metric crates (cvvdp, iwssim) additionally carry
        # crate-level `#![allow(...)]` (a group warn overrides command-line -A).
        # excessive_precision/approx_constant = exact metric coefficients
        # (rounding would shift scores); erasing_op/identity_op = index clarity;
        # too_many_arguments = kernel signatures; doc_lazy_continuation/
        # if_same_then_else = cosmetic.
        run: >
          cargo clippy --workspace --no-default-features --features wgpu,all-metrics -- -D warnings
          -A clippy::excessive_precision -A clippy::approx_constant
          -A clippy::erasing_op -A clippy::identity_op -A clippy::too_many_arguments
          -A clippy::doc_lazy_continuation -A clippy::if_same_then_else
          -A clippy::doc_overindented_list_items
