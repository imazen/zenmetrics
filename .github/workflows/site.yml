name: Browser website
on:
  workflow_dispatch:
    inputs:
      nn_models:
        description: 'Learned metrics the pre-deploy check runs on SwiftShader WebGPU (comma list, or all)'
        default: 'lpips-alex,lpips-squeeze,stlpips-alex,musiq,wadiqam-fr-live,wadiqam-nr-live,wd'
  push:
    branches: [master]
    paths:
      - '.github/workflows/site.yml'
      - 'web/site/**'
      - 'scripts/dashboard/publish_extension.py'
      - 'web/metrics/**'
      - 'crates/zenmetrics-browser/**'
      - 'crates/zenmetrics-api/**'
      - 'crates/zenmetrics-cli/src/metrics/**'
      - 'crates/zenmetrics-cli/src/decode.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/sibling-pins.tsv'
      - 'scripts/checkpoint/build-browser.sh'
      - 'scripts/checkpoint/build-codecs.sh'
      - 'web/codecs/**'
      - 'scripts/checkpoint/*pages.py'
      - 'scripts/checkpoint/test_browser_coverage.py'
      - 'scripts/checkpoint/vendor-ort.py'
      - 'crates/zenmetrics-nn/src/**'
      - 'benchmarks/browser_nn_2026-10-17/**'
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  # Finish the current verified build; retain only the newest queued follow-up.
  # Static evidence updates must not repeatedly cancel the cold WASM build.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check browser catalog coverage
        run: python3 scripts/checkpoint/test_browser_coverage.py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-06
          components: rust-src
          targets: wasm32-unknown-unknown
      - run: bash scripts/ci/clone-siblings.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checkpoint-browser
      - uses: actions/cache@v6
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-linux-0.2.129
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build and assemble current viewer
        run: |
          mkdir -p "$HOME/tmp"
          export TMPDIR="$HOME/tmp" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          CHECKPOINT_OUT="$GITHUB_WORKSPACE/browser-build" bash scripts/checkpoint/build-browser.sh
          python scripts/checkpoint/prepare-pages.py --build browser-build --source "$GITHUB_SHA" --out site
      # Workbench only: benchmark and reproduction evidence is published by the metric brief
      # (scripts/complexity/brief.sh); web/site/_redirects sends the old /aic2026/ pages there.
      - name: Add landing navigation
        run: python scripts/dashboard/publish_extension.py --viewer site --landing-only --source "$GITHUB_SHA"
      - name: Verify isolated browser workers
        env:
          NN_MODELS: ${{ inputs.nn_models }}
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          cargo run --locked --release -p zenmetrics-browser --example browser_oracle > "$HOME/tmp/browser-oracle.json"
          # Learned metrics run on Chromium's SwiftShader WebGPU adapter. The
          # default subset covers every model kind (pair graph, no-reference,
          # WaDIQaM trunk/head, WD statistics, the CPU-provider MUSIQ); the
          # full set's GPU and SwiftShader receipts are in
          # benchmarks/browser_nn_2026-10-17/.
          python scripts/checkpoint/check-pages.py site --oracle "$HOME/tmp/browser-oracle.json" --report "$HOME/tmp/browser-results.json" \
            --nn-models "${NN_MODELS:-lpips-alex,lpips-squeeze,stlpips-alex,musiq,wadiqam-fr-live,wadiqam-nr-live,wd}"
      - name: Report missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Deployment is not configured. Set CLOUDFLARE_API_TOKEN with Cloudflare Pages Edit permission."
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 338ad3b06716695d6e2c81c864e387d8
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the Cloudflare Pages Edit token in CLOUDFLARE_API_TOKEN'; exit 1; }
          npx --yes wrangler@4.149.0 pages deploy site --project-name zenmetrics-site --branch master --commit-hash "$GITHUB_SHA"
      - name: Verify deployed browser workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # `pages deploy` returns before the production URL serves the new
          # deployment; check-pages.py would then read the previous index.
          # Wait until the live index and provenance name this commit.
          url=https://zenmetrics-site.pages.dev/
          for attempt in $(seq 1 30); do
            served=$(curl -fsS --max-time 20 "${url}site-source.json?ready=$attempt" | python3 -c 'import json,sys; print(json.load(sys.stdin)["source_commit"])' || true)
            if [ "$served" = "$GITHUB_SHA" ] && curl -fsS --max-time 20 "${url}?ready=$attempt" | grep -q "assets/$GITHUB_SHA/app.js"; then
              break
            fi
            sleep 10
          done
          if [ "$served" != "$GITHUB_SHA" ]; then
            echo "Production still serves ${served:-no provenance}, not $GITHUB_SHA"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' https://metrics.imazen.org/aic2026/)
          [ "$code" = 301 ] || { echo "/aic2026/ should redirect to the metric brief, got HTTP $code"; exit 1; }
          # The full learned-metric parity run checked this build above; the
          # live site re-runs one learned metric end to end.
          python scripts/checkpoint/check-pages.py site --url "$url" --nn-models lpips-squeeze
