name: Benchmark dashboard
on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/**'
      - 'web/dashboard/**'
      - 'scripts/dashboard/**'
      - 'docs/METRIC_PROVENANCE.md'
      - 'crates/zenmetrics-cli/src/metrics/mod.rs'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMPDIR: ${{ github.workspace }}/.dashboard-scratch
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/dashboard/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s scripts/dashboard -p 'test_*.py'
      - run: python scripts/dashboard/build.py --output _dashboard
      - run: python scripts/dashboard/check.py _dashboard
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _dashboard
  deploy:
    # Branch dispatches verify the build; production deploy follows coordinator landing.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
