name: Portable IQA benchmark smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    name: CPU smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Disk-backed scratch
        run: |
          mkdir -p "$HOME/tmp/bench-smoke"
          echo "TMPDIR=$HOME/tmp/bench-smoke" >> "$GITHUB_ENV"
      - name: Clone pinned workspace dependencies
        run: bash scripts/ci/clone-siblings.sh
      - name: Build and run two CPU metrics
        run: just bench-iqa smoke ssim2,gmsd --host ci --fixture synthetic-v1 --skip-native
      - name: Preserve first Windows executable
        if: runner.os == 'Windows'
        run: cp target/release/iqa-compete.exe "$HOME/tmp/bench-smoke/first.exe"
      - name: Verify resume
        run: just bench-iqa smoke ssim2,gmsd --host ci --fixture synthetic-v1 --skip-native | tee "$HOME/tmp/bench-smoke/resume.log"
      - name: Require no new timed cells
        run: |
          if ! grep -q 'added=0 skipped=' "$HOME/tmp/bench-smoke/resume.log"; then
            echo 'Resume created new cells or did not complete' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-smoke-${{ matrix.os }}
          path: |
            ~/tmp/bench-smoke/first.exe
            target/release/iqa-compete.exe
            target/bench-iqa/**
            benchmarks/iqa_compete_2026-10-16/repro-results/**
          if-no-files-found: warn
