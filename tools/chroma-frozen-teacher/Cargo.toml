[package]
name = "chroma-frozen-teacher"
version = "0.0.0"
edition = "2024"
publish = false

# Isolated from the current metric graph: the frozen teacher uses this exact
# published source, VCS b7c2b4b33f3a26b753caabd5264a7fef9c4f4545,
# crate SHA256 8dcca2000fbfa5923eb54b5bedddadbe5f7c83f7ef65285ebe0ed10daa78d0f0.
[workspace]

[dependencies]
fast-ssim2 = { version = "=0.8.2", features = ["imgref", "hdr-pu"] }
zenpng = { version = "=0.1.4", default-features = false }
zenpixels = { version = "=0.2.16", default-features = false }
zenpixels-convert = "=0.2.16"
enough = "0.4.2"
imgref = "1.12.3"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"

[[bin]]
name = "chroma-frozen-batch-teacher"
path = "src/batch.rs"
