[package]
name = "iqa-margarine-validation"
version = "0.0.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
[workspace]
[[bin]]
name = "iqa-margarine-validation"
path = "../../crates/margarine/iqa_contract.rs"
[dependencies]
zenmetrics-orchestrator = { path = "../../crates/zenmetrics-orchestrator", default-features = false, features = ["psy"] }
zenpsy-api = { git = "https://github.com/imazen/zenpixels", rev = "d234f3c63efca06d5d7d52cb39b6c1f92961e98f", version = "0.1.0" }
butteraugli = { git = "https://github.com/imazen/butteraugli", rev = "13c49cbcab6e2b2bb65f60e3cb28344463bacbf7", features = ["internals"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
archmage = "0.9.29"
magetypes = "0.9.29"
imgref = "1.12.3"
rgb = "0.8.53"
enough = "0.4.5"
rayon = { version = "1.12.0", optional = true }
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "d234f3c63efca06d5d7d52cb39b6c1f92961e98f" }
[profile.dev]
opt-level = 1
[features]
default = ["row-malta", "simd-malta", "avx512"]
research = []
rayon = ["dep:rayon"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
multirate = []
bounded = ["multirate"]
lattice = ["bounded"]
planar = ["lattice"]
stream-blur = ["planar"]
coarse-gaussian = ["stream-blur"]
row-psycho = ["stream-blur"]
row-tiles = ["row-psycho"]
phase-rows = ["row-psycho"]
native-gaussian = ["row-tiles", "phase-rows"]
native-mask = ["row-tiles", "phase-rows"]
full-malta = ["row-tiles"]
row-malta = ["full-malta"]
native-uhf = ["row-malta", "simd-malta"]
linear-steering = ["row-malta", "simd-malta"]
wide-malta = ["full-malta"]
simd-malta = ["full-malta"]
simd-opsin = ["simd-malta"]
planar-tiles = ["planar", "tiles"]
tiles = ["lattice"]
compact = ["multirate"]
compact4 = ["compact"]
reuse = ["compact"]
sparse = ["reuse"]
pooled = ["reuse"]
perceptual = ["reuse"]
physical = ["perceptual"]
refined = ["pooled"]
refined1 = ["refined"]
refined2 = ["refined"]
stratified = ["refined2"]
anchored-pool = ["stratified"]
peak-stratified = ["stratified"]
reference-regions = ["refined2"]
stable-peak = ["reference-regions"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("iir-blur", "unsafe-performance", "internals"))'] }

# Compile the original selected frontend too, retaining its legacy error API.
[[bin]]
name = "margarine-selected-frontend"
path = "../../crates/margarine/margarine.rs"
