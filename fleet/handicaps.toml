# Registered worker speed handicaps for epoch-sharded claiming (weighted rendezvous hashing).
#
# REGISTERED means measured and committed — never auto-tuned. Each multiplier states its
# measurement basis in a comment; 1.0 = the fleet-reference throughput for that mode, 0.0 =
# excluded from that mode's sharding (role specialization). Workers absent from this file
# weigh 1.0 in every mode. Worker keys are the sanitized worker ids (`worker_key`) the boxes
# heartbeat under — NEUTRAL node ids only (household-fleet naming rules).
#
# WHY per-mode, and why encode is per ENCODER TYPE: a box's relative throughput is not one
# number. Encode scales with cores×IPC — but per-encode concurrency differs (process-parallel
# single-threaded encoders scale with core count; internally-threaded encoders like svt run
# their own pool and compress the many-core advantage; memory-bound encoders re-rank boxes
# again), so encode multipliers are keyed `{ <codec_type> = w, default = w }` and cross-type
# extrapolation is deliberately NOT done: unmeasured types fall back to `default`. CPU metrics
# (cvvdp/butteraugli/ssim2 on CPU) are memory/vector-bound — a different ranking again. GPU
# metrics are the card, not the CPU.
#
# UPDATE PROCEDURE (per box, per encoder type):
#   1. Run the type-bench matrix on the box: `scripts/jobsys/handicap_typebench.sh` — it times
#      a fixed registered cell set per encoder type through the ORDINARY worker path (real
#      container/admission/I/O), minutes per row, and prints cells/min per type.
#   2. Normalize against the current 1.0 reference box for that type (or promote a new
#      reference and rescale the column — only ratios matter to the sharding).
#   3. Edit this file; cite the bench run id / ledger scan in the row comment; commit.
#   4. Live campaigns converge via the RunControl `worker_weights` override (next pass); the
#      committed file itself reaches boxes at their next image roll. For a mid-campaign weight
#      change ALWAYS write the control override too — mixed-image fleets otherwise shard from
#      different registries until the roll completes (bounded ledger-deduped duplicate work,
#      but avoidable).
#
# Seed provenance (2026-08-06): the `encode.zenavif` column is MEASURED from the avifgen
# encode-run ledger attribution audit (status doc `docs/status/avif-datagen-2026-08.md`,
# commit 0f9fa073; whole-campaign scan, 1,518,977 rows / 508,239 distinct DONE at 21:30Z):
# per-box distinct-done credit over the stated active window, normalized to lianli = 1.0
# (20.8k cells/h). svt / jxl / gainmap encode types have NO per-box data yet (the HDR encode
# wave ran operator-box-only) → they fall back to `default = 1.0` with the type-bench TODO;
# per the user's directive, cross-type extrapolation is wrong, so we do not seed them from
# the zenavif column. `metric` is seeded proportional to the measured zenavif encode credit
# (no per-box CPU-metric measurement exists yet — TODO type-bench metric rows; the
# memory-bound ranking may differ, notably for SMT-heavy boxes). `gpu_metric` bases are per
# row. Ratios are what matter; absolute scale is arbitrary.

