[package]
name = "zenmetrics-codec-avif"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AVIF module of the zenmetrics browser viewer: zenavif encode and decode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zenavif = { version = "0.2.0", default-features = false, features = ["encode"] }
imgref = "1.12.3"
rgb = "0.8.53"
enough = "0.4.5"
almost-enough = "0.4.3"
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
zenpixels = ">=0.2.16, <0.4.0"
zenpixels-convert = ">=0.2.16, <0.4.0"
