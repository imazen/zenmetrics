# Reviewed dataset schemas; unclassified uploads fail the dashboard build.

[[dataset]]
glob = "benchmarks/metric_loop_st_2026-08-30.tsv"
family = "speed"
adapter = "loop"
host = "mac"
threads = 1
metadata = ["benchmarks/metric_loop_2026-08-30.meta"]
columns = ["metric", "size_label", "w", "h", "mp", "oneshot_ms", "precompute_ms", "warm_per_cand_ms", "ingress_ms", "ingress_pct_of_warm", "warm_alt_ms", "warm_over_oneshot", "loop_n5_measured_ms", "loop_n5_predicted_ms", "loop_n5_model_err_pct", "breakeven_candidates", "n_runs"]
note = "Encoder-search loop, planar linear f32; macOS ARM64; not sweep ingress."

