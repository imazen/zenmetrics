[package]
name = "cpu-profile"
version = "0.0.0"
publish = false
edition = "2024"
description = "Phase 9x — single-call heaptrack/callgrind harness for the 6 CPU metrics."

[[bin]]
name = "cpu-profile"
path = "src/main.rs"

# Task #139: zenbench wall-time harness. Times each (metric, mode, size)
# per-call with zenbench's interleaved round-robin (kills thermal/turbo
# bias) and writes a TSV of mean per-call wall + cold-first-call.
[[bin]]
name = "cpu-wall"
path = "src/bin/cpu_wall.rs"

# `metrics-parallel` turns on each metric crate's own threading (rayon) feature,
# which the CLI build leaves off for all of them (checked with `cargo tree -e
# features -i <crate> -p zenmetrics-cli`, 2026-10-09). Feature unification
# reaches the CLI's copies, so `new-metrics-wall` then measures the same
# dispatch with the metrics threaded. fast-ssim2's switch is named `rayon`.
[features]
compete-nn = ["compete", "zenmetrics-cli/nn-ort", "zenmetrics-cli/nr"]
compete = [ "dep:zenresize", "dep:zenmetrics-abstractions", "dep:nlpd", "avx512"]
# Directly included CLI modules resolve dependencies and cfgs in this package.
avx512 = ["archmage/avx512", "magetypes/avx512", "zenmetrics-math/avx512", "zenmetrics-cli/avx512"]
heap-phases = ["zenbench/heap-profiling"]
study-gpu-wgpu = ["zenmetrics-api/all-metrics", "zenmetrics-api/wgpu", "dep:cubecl", "cubecl/wgpu"]
study-gpu-cuda = ["zenmetrics-api/all-metrics", "zenmetrics-api/cuda", "dep:cudarc", "dep:cubecl", "cubecl/cuda"]
metrics-parallel = [
    "cvvdp/parallel", "iwssim/parallel", "fast-ssim2/rayon",
    "dep:fsim", "fsim/parallel", "dep:haarpsi", "haarpsi/parallel",
    "dep:mad-iqa", "mad-iqa/parallel", "dep:msssim", "msssim/parallel",
    "dep:psnrhvs", "psnrhvs/parallel", "dep:vif", "vif/parallel",
    "dep:vmaf", "vmaf/parallel", "dep:vsi", "vsi/parallel",
    "dep:mdctpsnr", "mdctpsnr/parallel",
]

[dependencies]
archmage.workspace = true
magetypes.workspace = true
zenmetrics-math = { path = "../../../../crates/zenmetrics-math", features = ["std"] }
sha2 = "0.11.0"
nlpd = { path = "../../../../crates/nlpd", optional = true, features = ["parallel", "avx512"] }
zenresize = { git = "https://github.com/imazen/zenresize", rev = "e6c077561dcb426b23d8e7c3da1ca0e12cc13c5f", optional = true }
zenmetrics-abstractions = { path = "../../../../crates/zenmetrics-abstractions", optional = true }
cubecl = { workspace = true, optional = true }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"], optional = true }
zenmetrics-api = { workspace = true, features = ["cpu-metrics", "pixels", "hdr"] }
serde = { workspace = true }
serde_json = { workspace = true }
zenpixels = { workspace = true, features = ["std"] }
zenbench = { git = "https://github.com/imazen/zenbench", rev = "ac675d3", default-features = false, features = ["precise-timing", "alloc-profiling"] }
cvvdp        = { path = "../../../../crates/cvvdp", default-features = false, features = ["std", "avx512"] }
iwssim       = { path = "../../../../crates/iwssim", default-features = false, features = ["std", "avx512"] }
zensim       = { workspace = true }
# RESOLVED VERSION: workspace [patch.crates-io] supplies fast-ssim2 0.9.1
# (zenpixels 0.5 cohort pin). Keep `rayon` off by default here; `metrics-parallel`
# turns it on explicitly.
fast-ssim2   = { workspace = true, features = ["imgref"] }
# Inherit the workspace spec (3.5 + `threads`). The local dssim-core pin's
# no-`threads` path doesn't compile (its zero-dep rayon fallback is a WIP
# stub), and dssim-core's parallelism is what we profile anyway.
dssim-core   = { workspace = true }
butteraugli  = { path = "../../../../../../butteraugli/butteraugli" }
# GMSD (in-tree port of libgmsd). `parallel` = rayon bands, as the CLI and the
# zensim speed arm run it; RAYON_NUM_THREADS sets the band concurrency, which
# is what scales its scratch (per-band ring rows + gray scratch rows).
gmsd         = { path = "../../../../crates/gmsd", default-features = false, features = ["std", "parallel", "avx512"] }
imgref       = "1"
rgb          = "0.8"
# Phase 9.Y: zero-copy reinterpret of interleaved sRGB-u8 byte buffers as
# `&[[u8; 3]]` / `&[RGB<u8>]` — mirrors the adapter so the driver's heap
# accounting reflects the production allocation pattern.
bytemuck     = "1"
# Optional: only so `metrics-parallel` can name their `parallel` features.
fsim         = { workspace = true, optional = true, features = ["avx512"] }
haarpsi      = { workspace = true, optional = true, features = ["avx512"] }
mad-iqa      = { workspace = true, optional = true, features = ["avx512"] }
msssim       = { workspace = true, optional = true, features = ["avx512"] }
psnrhvs      = { workspace = true, optional = true, features = ["avx512"] }
vif          = { workspace = true, optional = true, features = ["avx512"] }
vmaf         = { workspace = true, optional = true, features = ["avx512"] }
vsi          = { workspace = true, optional = true, features = ["avx512"] }
mdctpsnr     = { workspace = true, optional = true }
# cpu-metrics only: pulls nlpd + tempfile + the native-CPU backends — the same
# dep set this crate already builds — plus the umbrella (`zenmetrics-api`)
# native-CPU dispatch. No GPU/cubecl/codec deps enabled.
zenmetrics-cli = { path = "../../../../crates/zenmetrics-cli", default-features = false, features = ["cpu-metrics", "png", "jpeg"] }
# Real-photo content class for `NMW_CONTENT=photo` (source.png + q20.jpg pair).
zenmetrics-corpus = { path = "../../../../crates/zenmetrics-corpus" }
# Thread-scaling cells (`par1/par4/par8`): a direct rayon dep for THIS bin's
# pair-level parallelism only — does NOT turn on fast-ssim2's `rayon` feature
# (the aarch64 caveat above still holds; fast-ssim2 stays off-rayon).
rayon        = "1"
tempfile     = "3"

[profile.release]
debug = 1
lto = false
codegen-units = 1
incremental = false

# Task #163: encoder-search-loop harness. Times the LINEAR F32 PLANAR call
# shape that jxl-encoder's vardct loops actually use (cpu-wall times the
# packed-sRGB-u8 sweep shape), decomposed into precompute / ingress /
# warm-compare so `T(N) = precompute + N*(ingress + warm)` can be fit.
[[bin]]
name = "loop-wall"
path = "src/bin/loop_wall.rs"

# Task 2026-09-24 (extended 2026-10-09 to the 09-22..27 metric batch): wall-time + thread-scaling + heaptrack driver for the NEW
# metrics (nlpd / psnr / psnr-y / ssim / ms-ssim + the libvmaf adapter's
# RGB→YUV420 conversion half — no `vmaf` binary required). Goes through the
# REAL `zenmetrics_cli::metrics::run_metric` dispatch so the numbers are the
# shipped code path, not a re-link of the algorithm.
[[bin]]
name = "new-metrics-wall"
path = "src/bin/new_metrics_wall.rs"

# Repeats one metric on one prepared pair for perf-counter deltas
# (docs/IQA_COMPLEXITY.md, scripts/complexity/perf_deltas.py).
[[bin]]
name = "complexity-reps"
path = "src/bin/complexity_reps.rs"

[lints]
workspace = true

[[bin]]
name = "iqa-compete"
path = "src/bin/iqa_compete.rs"
required-features = ["compete"]

[[bin]]
name = "bench-iqa"
path = "src/bin/bench_iqa.rs"
required-features = ["compete"]
