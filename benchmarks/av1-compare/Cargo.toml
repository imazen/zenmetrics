[package]
name = "zenmetrics-av1-compare"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
svtav1 = { package = "zenav1-svt", path = "../../../zenav1-svt/rust/svtav1" }
aom-encode = { package = "zenav1-aom-encode", path = "../../../zenav1-aom/crates/aom-encode" }
zenrav1e = { path = "../../../zenrav1e" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
yuv = "0.8.17"
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
imgref = "1"

zenfleet-core = { path = "../../crates/zenfleet-core" }
zenfleet-ctl = { path = "../../crates/zenfleet-ctl" }
zenfleet-worker = { path = "../../crates/zenfleet-worker" }
zenfleet-ledger = { path = "../../crates/zenfleet-ledger" }
arrow-array = "58.2.0"
parquet = { version = "58.2.0", default-features = false, features = ["arrow", "zstd", "snap"] }
clap = { version = "4", features = ["derive"] }
tar = "0.4"
tempfile = "3"

[[bin]]
name = "zenfleet-worker"
path = "../../crates/zenfleet-worker/src/bin/worker.rs"

[[bin]]
name = "zenfleet-ctl"
path = "../../crates/zenfleet-ctl/src/bin/jobctl.rs"

[[bin]]
name = "zenmetrics-av1-compare"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[profile.release]
debug = 1

[patch.crates-io]
# Match the consuming zenavif graph; dependency workspace patches do not propagate.
archmage = { git = "https://github.com/imazen/archmage", rev = "cc24398c9a9fee0251722931e295da840730704d" }
archmage-macros = { git = "https://github.com/imazen/archmage", rev = "cc24398c9a9fee0251722931e295da840730704d" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "cc24398c9a9fee0251722931e295da840730704d" }
